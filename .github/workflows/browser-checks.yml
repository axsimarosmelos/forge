name: Check Forge in Chromium
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - index.html
      - frontend/**
      - tests/**
      - .github/workflows/browser-checks.yml
permissions:
  contents: read
  checks: write
concurrency:
  group: forge-browser-checks
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Planning, source and frontend regressions
        run: |
          node tests/catalog-core.cjs
          node tests/frontend.cjs
          python3 tests/catalog_sources.py
          node tests/learning-core.cjs
          python3 tests/learning-content.py
          node --test tests/backend.test.mjs
      - name: Test the built site in a real browser
        run: node tests/browser-smoke.mjs
      - name: Publish browser test report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const file = 'test-results/browser-report.json';
            const report = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, 'utf8')) : {result: 'FAIL', error: 'Browser test did not produce a report.'};
            await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo,
              name: 'Forge browser report', head_sha: context.sha,
              status: 'completed', conclusion: report.result === 'PASS' ? 'success' : 'failure',
              output: {title: 'Browser: ' + report.result, summary: '```json\n' + JSON.stringify(report, null, 2) + '\n```'}
            });
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-browser-screenshots
          path: test-results/*.png
          retention-days: 7
