services:
  forge-api:
    build: .
    env_file: .env
    environment:
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8787:8787"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    init: true
    restart: unless-stopped
