</style></head><body><div id="storage-warning" class="saved-warning hide" role="status"></div><aside class="sidebar"><a href="#today" class="brand" aria-label="Forge home"><span class="brandmark">f</span><span>forge<span style="color:#7d9a5e">.</span></span></a><div class="brand-sub">BUILT THROUGH PRACTICE</div><div class="nav-label">YOUR WORKSPACE</div><nav id="nav"></nav><div class="side-bottom"><div class="journey-mini"><div class="between small"><span>From zero, forward.</span><span id="side-day" class="mono">01 / 40</span></div><div class="bar" style="margin-top:12px"><i id="side-progress"></i></div><p class="small muted" style="margin-top:9px">One understood idea at a time.</p></div><button class="account textbtn" onclick="go('settings')" style="width:100%;text-align:left"><span class="avatar" id="avatar">Y</span><span><b id="account-name">Your learning space</b><br><span class="muted" style="font-size:10px">Python · Starting from scratch</span></span></button></div></aside><main><header class="topbar"><div class="breadcrumb small"><span class="muted">Workspace</span> <span style="margin:0 12px;color:#b1baab">/</span> <span id="crumb">Today</span></div><span class="mobile-brand">forge.</span><div class="top-meta"><span class="hide-mobile" id="today-date"></span><span><i class="live-dot"></i><span id="save-label">Saved on this browser</span></span><button class="close" onclick="go('settings')" aria-label="Settings" id="settings-top"></button></div></header><div class="content" id="app"></div></main><div id="modal-root"></div><div id="toast" class="toast hide" role="status" aria-live="polite"></div><script id="curriculum-data" type="application/json">{"lessons": [{"id": "hello", "title": "Your first Python program", "subtitle": "Values, names, and instructions.", "prereq": [], "day": 1, "body": ["A program is a sequence of instructions. An algorithm is a step-by-step method for solving a problem; a recipe is an everyday example. Python is the language we will use to express those instructions. Start by predicting small programs before writing large ones.", "Python normally runs one line after another. print(...) displays a value. Text goes inside matching quotes: print(\"Hello\"). Whole numbers, such as 3, do not need quotes. A comment starts with # and explains code to a human; Python ignores it.", "A variable is a name for a value. coins = 3 binds the name coins to 3. The equals sign here means assignment. In coins = coins + 2, Python first calculates the right side using the old value, then stores the new value. Names are case-sensitive: coins and Coins are different.", "Use + for addition, - for subtraction, * for multiplication, / for division, // for floor division, and % for the remainder. With positive integers, 7 // 2 is 3 and 7 % 2 is 1. Parentheses control evaluation: (2 + 3) * 4 is 20."], "code": "coins = 3\ncoins = coins + 2\nprint(coins)\nprint(\"coins\")", "trace": "Line 1: coins is 3. Line 2: 3 + 2 becomes 5. Line 3 prints 5. Line 4 prints the literal text coins. Quotes change the meaning.", "trap": "print(\"3 + 2\") prints text, not 5. A missing quote or parenthesis causes a SyntaxError; inspect the indicated line.", "checks": [{"q": "What does print(3 + 4 * 2) display?", "answers": ["11"], "why": "Multiplication happens before addition: 3 + 8 = 11."}, {"q": "x = 4, then x = x + 3. What is x?", "answers": ["7"], "why": "The old value 4 is used to compute 4 + 3, then x is updated."}], "cards": [{"q": "What is the difference between print(5) and print(\"5\")?", "a": "Both display 5, but one value is an integer and the other is text. They behave differently in calculations."}, {"q": "What does x = x + 1 do?", "a": "Read the current value, add one, and assign the result back to x."}, {"q": "What is an algorithm?", "a": "A precise sequence of steps that transforms an input into the required output."}], "exercise": "In the Python lab, make a variable score equal to 10, increase it by 7, and print it. Predict the output before running.", "solution": "score = 10\nscore = score + 7\nprint(score)  # 17", "reference": "https://docs.python.org/3/tutorial/"}, {"id": "input", "title": "Read input. Produce output.", "subtitle": "Turn a problem statement into data.", "prereq": ["hello"], "day": 2, "body": ["A contest judge runs your program with input you have not seen. Your job is to read that input and print exactly the requested answer. input() reads one line and returns text without its ending newline. Do not add prompts such as input(\"Enter a number:\") in a contest.", "int(...) converts a valid whole-number string to an integer. n = int(input()) reads one integer. Without int, \"2\" + \"3\" becomes \"23\". A ValueError usually means the text cannot be converted the way you requested.", "For two space-separated numbers, a, b = map(int, input().split()) first splits a line into pieces, converts each piece to an integer, then assigns them in order. We will learn lists and functions later; for now this is a useful input recipe. Use it only when the line really contains two numbers.", "On Codeforces, you usually read input and print output. On LeetCode, you usually fill in a provided method and return a result. Keep the supplied LeetCode class and signature. Always read whether the first integer is a test-case count, a list length, or part of the data."], "code": "a, b = map(int, input().split())\ntotal = a + b\nprint(total)", "trace": "With input 4 9, split produces two text pieces, int converts them to 4 and 9, and the program prints 13. Paste 4 9 into the lab input box.", "trap": "Do not print explanations or debug text in your submitted output. Do not assume every problem starts with a test-case count.", "checks": [{"q": "What type does input() return? Answer str or int.", "answers": ["str", "string"], "why": "input returns text, even when the line looks like a number."}, {"q": "What does int(\"12\") + 3 evaluate to?", "answers": ["15"], "why": "Convert the text to an integer before adding."}], "cards": [{"q": "Read one integer in Python.", "a": "n = int(input())"}, {"q": "Read two integers on one line.", "a": "a, b = map(int, input().split())"}, {"q": "How do Codeforces and LeetCode output styles usually differ?", "a": "Codeforces: read stdin and print. LeetCode: use the provided method and return the result."}], "exercise": "Read two integers on one line and print their product. Try 6 7 and then 0 9.", "solution": "a, b = map(int, input().split())\nprint(a * b)", "reference": "https://docs.python.org/3/tutorial/"}, {"id": "if", "title": "Make decisions", "subtitle": "Conditions, booleans, and edge cases.", "prereq": ["input"], "day": 3, "body": ["A condition is an expression whose value is True or False. Compare values with == (equal), != (not equal), <, <=, >, and >=. Assignment uses =; comparison uses ==. For example, 5 > 3 is True.", "An if statement runs its indented block only when its condition is true. A colon starts the block. Use four spaces consistently. elif checks another condition if earlier conditions failed; else handles everything remaining.", "Combine conditions with and, or, and not. Both sides must hold for and. At least one must hold for or. n % 2 == 0 tests whether an integer is even. Read the complete condition aloud to catch mistakes.", "An edge case is an input near a boundary where a plausible solution might fail: zero if allowed, the smallest input, equality at a threshold, odd versus even. For a rule that requires two positive even parts, simply checking evenness is insufficient; the total must also be greater than two."], "code": "n = int(input())\nif n % 2 == 0:\n    print(\"even\")\nelse:\n    print(\"odd\")", "trace": "Input 7 gives remainder 1, so the condition is false and the else block prints odd. Input 8 gives remainder 0 and prints even.", "trap": "Using > instead of >= loses the equality case. Write a test exactly at every threshold.", "checks": [{"q": "What is 9 % 2?", "answers": ["1"], "why": "Nine is four pairs plus one."}, {"q": "Is 3 > 3 True or False?", "answers": ["false"], "why": "Strictly greater excludes equality."}], "cards": [{"q": "How do you test whether n is even?", "a": "n % 2 == 0"}, {"q": "What is the difference between = and ==?", "a": "= assigns a value; == compares two values."}, {"q": "What test should accompany a threshold condition?", "a": "An input exactly at the threshold, plus one below and one above if allowed."}], "exercise": "Read an age and print YES when it is at least 18; otherwise print NO. Test 17, 18, and 19 separately.", "solution": "age = int(input())\nif age >= 18:\n    print(\"YES\")\nelse:\n    print(\"NO\")", "reference": "https://docs.python.org/3/tutorial/"}, {"id": "loops", "title": "Repeat with purpose", "subtitle": "For loops, ranges, and accumulators.", "prereq": ["if"], "day": 4, "body": ["A loop repeats instructions. for i in range(4) runs the indented body with i equal to 0, 1, 2, and 3. The end of range is excluded. range(1, n + 1) visits integers from 1 through n.", "An accumulator stores a running result. Set total = 0 before the loop, then update it inside the loop. A counter is a special accumulator: count += 1 is shorthand for count = count + 1.", "A while loop repeats while its condition remains true. Something in the loop must eventually change that condition, or execution never finishes. break exits the nearest loop. continue skips to its next iteration.", "If a statement says there are t independent test cases, read t and loop t times. Reset each case’s accumulator inside the test-case loop. Trace the value after every iteration before trying to optimize."], "code": "n = 4\ntotal = 0\nfor i in range(1, n + 1):\n    total += i\nprint(total)", "trace": "i = 1 → total 1; i = 2 → total 3; i = 3 → total 6; i = 4 → total 10. Initialization happens once, outside the loop.", "trap": "Putting total = 0 inside the loop erases previous work. range(n) visits n values but never visits n itself.", "checks": [{"q": "How many iterations does range(5) produce?", "answers": ["5"], "why": "It produces 0, 1, 2, 3, 4."}, {"q": "What is total after adding every i in range(1, 4), starting at 0?", "answers": ["6"], "why": "1 + 2 + 3 = 6; the endpoint 4 is excluded."}], "cards": [{"q": "What values does range(3) produce?", "a": "0, 1, 2; the endpoint is excluded."}, {"q": "Where should a sum accumulator be initialized?", "a": "Before the loop that accumulates its result."}, {"q": "Why can a while loop run forever?", "a": "Its condition never becomes false; check that each iteration makes progress."}], "exercise": "Use a loop to count how many integers from 1 through 10 are even. The answer should be 5.", "solution": "count = 0\nfor i in range(1, 11):\n    if i % 2 == 0:\n        count += 1\nprint(count)", "reference": "https://docs.python.org/3/tutorial/"}, {"id": "lists", "title": "Work with a sequence", "subtitle": "Lists, indexing, and scanning.", "prereq": ["loops"], "day": 5, "body": ["A list stores an ordered sequence: nums = [4, 8, 2]. The first position has index 0. nums[1] is 8. len(nums) is the number of items. The final valid nonnegative index is len(nums) - 1; nums[-1] also accesses the last item.", "Use for x in nums when you need values. Use for i in range(len(nums)) when positions matter. A list can change: nums.append(9) adds to the end; nums[0] = 7 replaces the first value.", "list(map(int, input().split())) reads a line of integers into a list. If the problem gives n followed by a line of n numbers, read n separately. sum(nums), min(nums), and max(nums) are useful built-ins; min and max need a nonempty list unless you provide a default.", "A scan processes each element once while maintaining a small amount of state. For example, count the positive values or remember the largest value seen so far. A slice nums[l:r] copies positions l through r - 1."], "code": "nums = [4, -1, 8, 0]\npositive = 0\nfor x in nums:\n    if x > 0:\n        positive += 1\nprint(positive)", "trace": "4 increases the counter to 1. -1 does not. 8 increases it to 2. 0 does not qualify. The answer is 2.", "trap": "An IndexError often means you reached len(nums). Copying with b = a makes another name for the same list; b = a.copy() copies a flat list.", "checks": [{"q": "For a = [4, 8, 2], what is a[1]?", "answers": ["8"], "why": "Indexing starts at zero."}, {"q": "What is the last valid nonnegative index of a 6-item list?", "answers": ["5"], "why": "The indices run from 0 to 5."}], "cards": [{"q": "What does a[l:r] include?", "a": "Indices l through r - 1; the right endpoint is excluded."}, {"q": "How do you read a line of integers into a list?", "a": "a = list(map(int, input().split()))"}, {"q": "When do you iterate over indices instead of values?", "a": "When you need a position, need neighbors, or need to update an element by position."}], "exercise": "For [2, 7, 3, 9], count values at least 5 using a loop. Expect 2.", "solution": "count = 0\nfor x in [2, 7, 3, 9]:\n    if x >= 5:\n        count += 1\nprint(count)", "reference": "https://docs.python.org/3/tutorial/"}, {"id": "strings", "title": "Think in characters", "subtitle": "Text, normalization, and comparisons.", "prereq": ["lists"], "day": 6, "body": ["A string is a sequence of characters: s = \"code\". Indexing and len work like they do for lists. s[0] is \"c\". A for loop can visit each character. Strings are immutable: you cannot assign to s[0]. Build a new string instead.", "s.lower() and s.upper() return transformed strings. They do not change s unless you assign the result. s.strip() removes whitespace at the ends. s.split() separates whitespace-delimited words; \"\".join(parts) combines string pieces without a separator.", "Strings compare lexicographically, like dictionary order based on character values. If a problem ignores case, normalize both strings first. s[::-1] creates a reversed copy; the -1 step walks backward.", "To count a property, scan characters and update a counter. To build many pieces of output, append them to a list and join at the end. Be precise about whether spaces, punctuation, or case matter in the statement."], "code": "word = \"CoDe\"\nword = word.lower()\nprint(word)\nprint(word[::-1])", "trace": "lower creates code; reversing that string produces edoc. The original mixed case is lost only because word was reassigned.", "trap": "Calling s.lower() alone does not update s. The expression returns a new string.", "checks": [{"q": "What is len(\"python\")?", "answers": ["6"], "why": "There are six characters."}, {"q": "What is \"AbC\".lower()?", "answers": ["abc"], "why": "All alphabetic characters become lowercase."}], "cards": [{"q": "Can you assign s[0] = \"x\" on a string?", "a": "No. Strings are immutable. Build a new string or use a list of characters."}, {"q": "How do you reverse a string?", "a": "s[::-1] returns a reversed copy."}, {"q": "How do you compare text while ignoring case?", "a": "Normalize both values, for example with lower(), then compare."}], "exercise": "Count the letter a in \"banana\" with a loop. Expect 3.", "solution": "count = 0\nfor ch in \"banana\":\n    if ch == \"a\":\n        count += 1\nprint(count)", "reference": "https://docs.python.org/3/tutorial/"}, {"id": "functions", "title": "Package a small idea", "subtitle": "Parameters, return values, and LeetCode.", "prereq": ["strings"], "day": 8, "body": ["A function is a named reusable set of instructions. def add(a, b): defines the name and parameters. Calling add(2, 5) binds a to 2 and b to 5 for that call. The body is indented.", "return sends a value back to the caller and immediately exits the function. print only displays text. A function without an executed return returns None. Assign a returned result to a variable when you need to use it later.", "Local variables belong to that function call. Prefer passing input through parameters and returning an answer instead of depending on global variables. This makes small tests easier.", "LeetCode commonly supplies class Solution and a method with self as its first parameter. Keep that wrapper and return the answer inside the method. In the lab, you can practice the algorithm as a plain function. For Codeforces, a solve() function can read input and print, then you call solve()."], "code": "def add(a, b):\n    return a + b\n\nanswer = add(2, 5)\nprint(answer)", "trace": "add receives 2 and 5, returns 7, and answer stores 7. Only the last line displays anything.", "trap": "Printing a correct value inside a LeetCode method is usually insufficient; the judge expects its returned value.", "checks": [{"q": "What does add(2, 5) return in the example?", "answers": ["7"], "why": "The return expression adds its two parameters."}, {"q": "What does a function return if it reaches the end without return?", "answers": ["none"], "why": "None is Python’s value representing the absence of a result."}], "cards": [{"q": "What is the difference between return and print?", "a": "return provides a value to the caller and exits the function; print displays output."}, {"q": "What is a parameter?", "a": "A name in a function definition that receives an argument at call time."}], "exercise": "Write double(n) that returns twice n, then print double(6).", "solution": "def double(n):\n    return 2 * n\n\nprint(double(6))", "reference": "https://docs.python.org/3/tutorial/"}, {"id": "complexity", "title": "Read the constraints", "subtitle": "How much work will your code do?", "prereq": ["functions"], "day": 9, "body": ["The same idea can be expressed with radically different amounts of work. Complexity describes how time or memory grows with input size n. Big O focuses on growth, ignoring constant factors and smaller terms.", "A single fixed arithmetic operation is O(1) under the usual bounded-integer model. One pass over n values is O(n). A loop over every ordered pair is O(n²). Sorting generally costs O(n log n). A process that repeatedly halves the search space costs O(log n).", "If n is 200,000, n² is 40 billion. That is a warning that a pair-by-pair Python solution will likely be too slow. Actual performance depends on operations, language, machine, and time limit; no fixed operations-per-second rule guarantees acceptance.", "Space complexity counts extra storage too. A list containing one entry per input item uses O(n) space; a handful of counters uses O(1) extra space. Write the simplest correct approach first, then compare its growth with the constraints."], "code": "a = [2, 4, 6]\nfor x in a:\n    print(x)\n\nfor x in a:\n    for y in a:\n        print(x, y)", "trace": "The first loop has 3 visits. The nested loops have 3 × 3 = 9 visits. Doubling the list length doubles the first cost but quadruples the second.", "trap": "Two consecutive O(n) loops total O(n), not O(n²). Nested loops require reasoning about their combined iteration count.", "checks": [{"q": "How many pair visits are there for two full nested loops over 10 items?", "answers": ["100"], "why": "Each of the 10 outer iterations performs 10 inner iterations."}, {"q": "What is the growth of two consecutive scans: O(n) or O(n^2)?", "answers": ["o(n)", "n"], "why": "n + n = 2n, which grows linearly."}], "cards": [{"q": "What does O(n²) usually suggest in code?", "a": "Considering all pairs, often with two full nested loops."}, {"q": "Why read constraints before choosing an algorithm?", "a": "They tell you whether the time and memory growth of your approach is plausible."}], "exercise": "Predict how many pairs two full loops over range(4) will print, then run them.", "solution": "count = 0\nfor i in range(4):\n    for j in range(4):\n        count += 1\nprint(count)  # 16", "reference": "https://docs.python.org/3/tutorial/"}, {"id": "counting", "title": "Remember what you have seen", "subtitle": "Dictionaries, sets, and frequencies.", "prereq": ["complexity"], "day": 10, "body": ["A dictionary maps keys to values: counts = {} starts an empty one. counts[x] accesses the value for x, but fails if that key is missing. counts.get(x, 0) returns zero when x is absent.", "To count occurrences, scan each value and do counts[x] = counts.get(x, 0) + 1. A set stores distinct values: seen = set(). seen.add(x) records a value; x in seen checks membership.", "In typical use, dictionary and set lookup are O(1) on average. A membership check in a list may scan the entire list and cost O(n). Choose a dictionary when you need a count or associated value, and a set when you only need presence.", "For a target-sum pair, remember earlier numbers. Before storing x, check whether target - x is already stored. Checking first prevents using the same array position twice."], "code": "counts = {}\nfor x in [3, 1, 3, 3]:\n    counts[x] = counts.get(x, 0) + 1\nprint(counts[3])", "trace": "First 3: 0 + 1. Then 1 gets its own entry. The next two 3s update the same key. counts[3] ends at 3.", "trap": "{} creates a dictionary, not an empty set. Use set(). A set discards duplicates, so it cannot preserve frequencies.", "checks": [{"q": "How many elements are in set([2, 2, 5])?", "answers": ["2"], "why": "Only distinct values 2 and 5 remain."}, {"q": "What does {}.get(\"x\", 0) return?", "answers": ["0"], "why": "The key is missing, so get returns the supplied default."}], "cards": [{"q": "When should you use a set instead of a dictionary?", "a": "When you only need to know whether a value has appeared, not its frequency or associated data."}, {"q": "Write the standard frequency update.", "a": "counts[x] = counts.get(x, 0) + 1"}], "exercise": "Count characters in \"level\". Print how many times e appears. Expect 2.", "solution": "counts = {}\nfor ch in \"level\":\n    counts[ch] = counts.get(ch, 0) + 1\nprint(counts[\"e\"])", "reference": "https://docs.python.org/3/tutorial/"}, {"id": "sorting", "title": "Put order to work", "subtitle": "Sorting, adjacent values, and useful keys.", "prereq": ["complexity"], "day": 11, "body": ["Sorting places values in a consistent order. sorted(a) returns a new sorted list. a.sort() rearranges a itself and returns None. The original positions are lost unless you preserve them separately.", "After sorting, equal values become neighbors and the smallest or largest values sit at the ends. Some problems become a scan over neighboring elements. The minimum difference between any two numbers, for example, is found among adjacent numbers in sorted order.", "Use reverse=True for descending order. A key function selects what to compare: sorted(words, key=len) orders words by length. Python sorting is stable: items with equal keys keep their relative input order.", "Sorting usually costs O(n log n). Ask whether the problem requires original order before sorting. If it does, retain indices or choose another approach."], "code": "a = [8, 3, 6, 3]\nb = sorted(a)\nprint(b)\nprint(a)", "trace": "b becomes [3, 3, 6, 8], while a remains [8, 3, 6, 3]. If we used a.sort(), a itself would change.", "trap": "Writing a = a.sort() replaces your list variable with None.", "checks": [{"q": "What is the first value in sorted([8, 2, 5])?", "answers": ["2"], "why": "Ascending order puts the smallest first."}, {"q": "Does list.sort() return the list or None?", "answers": ["none"], "why": "It changes the existing list and returns None."}], "cards": [{"q": "How do sorted(a) and a.sort() differ?", "a": "sorted returns a new list; sort mutates the existing list and returns None."}, {"q": "What must you check before sorting contest input?", "a": "Whether original order or original indices matter."}], "exercise": "Sort [9, 1, 6, 4] and print the difference between the largest and smallest.", "solution": "a = sorted([9, 1, 6, 4])\nprint(a[-1] - a[0])  # 8", "reference": "https://docs.python.org/3/tutorial/"}, {"id": "brute", "title": "Start with a correct baseline", "subtitle": "Enumerate candidates and test them.", "prereq": ["complexity"], "day": 12, "body": ["Brute force means systematically checking candidate answers. It is often the right solution when the candidate space is small. Define exactly what one candidate represents before writing loops.", "To enumerate unordered pairs of distinct indices, use i from 0 through n - 1 and j from i + 1 through n - 1. This avoids pairing an item with itself and avoids visiting both (i, j) and (j, i).", "For each candidate, check the required condition and update an answer. To minimize a result, initialize best appropriately, perhaps with float(\"inf\"). To count, initialize zero. To detect existence, use a Boolean or return on the first success.", "Brute force also gives a small-input reference for a faster algorithm. Generate tiny examples, compare both answers, and inspect disagreements. A counterexample is more useful than many passing samples."], "code": "a = [1, 3, 5]\nfor i in range(len(a)):\n    for j in range(i + 1, len(a)):\n        print(a[i], a[j])", "trace": "The candidates are (1, 3), (1, 5), and (3, 5). We never repeat a pair or reuse an index.", "trap": "Checking only the sample is insufficient. Enumerate tiny valid inputs and boundaries when testing.", "checks": [{"q": "How many unordered pairs of distinct positions exist in a 4-item list?", "answers": ["6"], "why": "4 × 3 / 2 = 6."}, {"q": "Should the inner index begin at i or i + 1 to exclude self-pairs?", "answers": ["i+1", "i + 1"], "why": "Starting at i + 1 excludes equal indices and reversed duplicates."}], "cards": [{"q": "When is brute force a good final algorithm?", "a": "When all candidates can be checked within the given time and memory constraints."}, {"q": "How can brute force help validate a faster solution?", "a": "Compare both implementations on many small inputs and inspect any mismatch."}], "exercise": "Count pairs in [1, 2, 3, 4] whose sum is 5. Expect 2.", "solution": "a = [1, 2, 3, 4]\ncount = 0\nfor i in range(len(a)):\n    for j in range(i + 1, len(a)):\n        if a[i] + a[j] == 5:\n            count += 1\nprint(count)", "reference": "https://docs.python.org/3/tutorial/"}, {"id": "math", "title": "Translate the arithmetic", "subtitle": "Remainders, divisibility, and ceiling division.", "prereq": ["brute"], "day": 13, "body": ["Before coding a story, name the quantities and write the relationship between them. Divisibility means a remainder of zero: a % b == 0 for nonzero b. Parity describes whether an integer is even or odd.", "For nonnegative a and positive b, the number of size-b groups needed to cover a items is (a + b - 1) // b. This is ceiling division. For 10 items in boxes of size 3, three boxes are insufficient, so the answer is four.", "An arithmetic sequence 1 + 2 + ... + n sums to n * (n + 1) // 2. Derive it by pairing the first and last terms. Prefer integer arithmetic when the result must be exact.", "The greatest common divisor can be computed using Euclid’s algorithm: replace (a, b) with (b, a % b) until b is zero. Python provides math.gcd. Verify assumptions such as positive divisors and whether zero is allowed."], "code": "items = 10\ncapacity = 3\nboxes = (items + capacity - 1) // capacity\nprint(boxes)", "trace": "(10 + 2) // 3 = 4. With items = 9, the same expression gives 3, so exact multiples do not gain an unnecessary box.", "trap": "a // b + 1 overcounts when a is exactly divisible by b.", "checks": [{"q": "How many boxes of capacity 4 cover 9 items?", "answers": ["3"], "why": "Two boxes cover only 8; three cover 12."}, {"q": "What is 12 % 3?", "answers": ["0"], "why": "12 is exactly divisible by 3."}], "cards": [{"q": "Ceiling-divide nonnegative a by positive b using integers.", "a": "(a + b - 1) // b"}, {"q": "What edge case breaks a // b + 1 as ceiling division?", "a": "When a is an exact multiple of b, it adds an unnecessary one."}], "exercise": "Compute the sum of 1 through 100 with a formula, then verify with a loop.", "solution": "n = 100\nprint(n * (n + 1) // 2)\nprint(sum(range(1, n + 1)))", "reference": "https://docs.python.org/3/tutorial/"}, {"id": "prefix", "title": "Reuse work with prefix sums", "subtitle": "Answer range totals without rescanning.", "prereq": ["lists", "complexity"], "day": 14, "body": ["If many questions ask for sums of ranges in the same list, rescanning every range repeats work. A prefix sum records the total before each position. Set p[0] = 0 and p[i + 1] = p[i] + a[i].", "With this convention p[k] is the sum of the first k elements. The sum over indices l through r inclusive is p[r + 1] - p[l]. For a half-open range [l, r), it is p[r] - p[l]. Draw the removed prefix to see why.", "Building p costs O(n) time and O(n) extra space. Each sum query then costs O(1). The simple structure assumes the original data does not change between queries.", "Prefix sums work with negative values too. Empty prefixes and one-element ranges are especially useful boundary tests."], "code": "a = [2, 5, 1, 4]\np = [0]\nfor x in a:\n    p.append(p[-1] + x)\nprint(p)\nprint(p[4] - p[1])", "trace": "p is [0, 2, 7, 8, 12]. Subtracting p[1] from p[4] removes the first element and leaves 5 + 1 + 4 = 10.", "trap": "Mixing inclusive and exclusive endpoints causes off-by-one errors. Write your convention before coding.", "checks": [{"q": "What is p[0] in this convention?", "answers": ["0"], "why": "It is the sum of zero elements."}, {"q": "For [2, 5, 1], what is the sum of indices 1 through 2?", "answers": ["6"], "why": "p[3] - p[1] = 8 - 2 = 6."}], "cards": [{"q": "Range sum l through r inclusive with a leading-zero prefix array?", "a": "p[r + 1] - p[l]"}, {"q": "What are the build and query costs of a static prefix-sum array?", "a": "Build O(n), query O(1), extra space O(n)."}], "exercise": "Build prefixes for [3, 4, 2] and find the sum of indices 0 through 1.", "solution": "p = [0]\nfor x in [3, 4, 2]:\n    p.append(p[-1] + x)\nprint(p[2] - p[0])  # 7", "reference": "https://docs.python.org/3/tutorial/"}, {"id": "twopointers", "title": "Move two boundaries", "subtitle": "Exploit sorted order to discard work.", "prereq": ["sorting", "brute"], "day": 15, "body": ["Two pointers are indices that move through data while preserving a useful rule. For a target-sum pair in a sorted list, begin with the leftmost and rightmost values.", "If their sum is too small, moving the right pointer left would only make it smaller. Move the left pointer right. If the sum is too large, move the right pointer left. If equal, a pair has been found.", "The proof justifies each discarded group of candidates. Each pointer moves at most n times, so the scan is O(n), after any sorting. This is not a universal replacement for nested loops: it relies on order or another monotonic property.", "If original indices are requested, sorting plain values loses them. Store (value, original_index) pairs or use a dictionary approach instead."], "code": "a = [1, 3, 4, 8]\ntarget = 7\nl, r = 0, len(a) - 1\nwhile l < r:\n    total = a[l] + a[r]\n    if total == target:\n        print(l, r)\n        break\n    if total < target:\n        l += 1\n    else:\n        r -= 1", "trace": "1 + 8 is too large → move r. 1 + 4 is too small → move l. 3 + 4 = 7 → indices 1 and 2.", "trap": "This movement rule requires ascending order. Using it on arbitrary unsorted data may miss a valid answer.", "checks": [{"q": "On an ascending list, if the pair sum is too small, which pointer moves: left or right?", "answers": ["left", "l"], "why": "Increase the smaller end to make a larger sum possible."}, {"q": "What is the scan complexity if each pointer only moves inward?", "answers": ["o(n)", "n"], "why": "There are at most a linear number of pointer moves."}], "cards": [{"q": "Why can the left pointer move when a sorted pair sum is too small?", "a": "Even the largest available partner was insufficient for that left value, so smaller partners cannot work either."}, {"q": "What must you preserve if the answer asks for original indices?", "a": "The mapping from each value to its original position."}], "exercise": "Change the example target to 9. Predict the returned indices before running.", "solution": "# With target = 9, the first pair 1 + 8 matches.\n# Zero-based indices are 0 and 3.", "reference": "https://docs.python.org/3/tutorial/"}, {"id": "binary", "title": "Halve the search space", "subtitle": "Binary search with a clear invariant.", "prereq": ["sorting", "complexity"], "day": 16, "body": ["Binary search works on sorted data, or more generally on a predicate that changes in only one direction. An invariant is a rule you keep true throughout a loop. For lower bound, our answer stays inside the boundary interval [lo, hi].", "We seek the first index whose value is at least x. Start lo = 0 and hi = len(a). Examine mid = (lo + hi) // 2. If a[mid] < x, all positions through mid are too small, so set lo = mid + 1. Otherwise set hi = mid.", "The loop ends at lo == hi. That value may equal len(a), meaning no element qualifies. To test exact membership, check the index is in range and a[index] == x.", "Each iteration roughly halves the remaining interval, so time is O(log n). Python’s bisect_left implements this lower-bound operation. Always trace empty, one-element, absent, and duplicate cases."], "code": "a = [2, 4, 4, 9]\nx = 4\nlo, hi = 0, len(a)\nwhile lo < hi:\n    mid = (lo + hi) // 2\n    if a[mid] < x:\n        lo = mid + 1\n    else:\n        hi = mid\nprint(lo)", "trace": "mid 2 has value 4 → hi 2. mid 1 has value 4 → hi 1. mid 0 has value 2 → lo 1. End at index 1, the first 4.", "trap": "For this convention, using lo = mid can get stuck. Do not mix update rules from inclusive and half-open implementations.", "checks": [{"q": "What is the lower-bound index of 4 in [2, 4, 4, 9]?", "answers": ["1"], "why": "Lower bound returns the first qualifying index."}, {"q": "What index is returned for x = 10 in this list?", "answers": ["4"], "why": "No value qualifies, so the answer is len(a)."}], "cards": [{"q": "What condition lets you use binary search?", "a": "Sorted data or a monotonic predicate: candidates change from false to true only once, or vice versa."}, {"q": "What is bisect_left(a, x)?", "a": "The insertion index before existing equal values: the first index with value at least x, or len(a)."}], "exercise": "Change x to 5 in the example and trace every boundary. Expect index 3.", "solution": "from bisect import bisect_left\nprint(bisect_left([2, 4, 4, 9], 5))  # 3", "reference": "https://docs.python.org/3/library/bisect.html"}, {"id": "greedy", "title": "Make a choice you can justify", "subtitle": "Local choices need a global argument.", "prereq": ["sorting", "brute"], "day": 17, "body": ["A greedy algorithm commits to a local choice and never revisits it. It is powerful only when you can justify that the choice still allows an optimal final solution. An intuition such as “largest first” is not a proof.", "For selecting the maximum number of nonoverlapping intervals, sorting by finishing time and taking each compatible interval works. Choosing an earlier finish leaves at least as much room for later intervals.", "An exchange argument compares an optimal solution with your choice. Replacing its first interval by the earliest-finishing one cannot reduce the space available afterward. Repeating this argument establishes the strategy.", "Try to break your rule with tiny cases. Greedy coin change with coins [1, 3, 4] fails for amount 6: largest-first uses 4 + 1 + 1, while 3 + 3 uses fewer coins. Some problems require dynamic programming."], "code": "intervals = [(1, 3), (2, 4), (3, 5)]\nintervals.sort(key=lambda p: p[1])\nend = float(\"-inf\")\ncount = 0\nfor start, finish in intervals:\n    if start >= end:\n        count += 1\n        end = finish\nprint(count)", "trace": "Choose (1, 3), skip (2, 4), choose (3, 5). Touching endpoints are allowed in this example. lambda p: p[1] is a short function returning the finish time.", "trap": "Check the statement’s endpoint rule. Some interval problems require start > end instead of >=.", "checks": [{"q": "What is the minimum coin count for amount 6 with coins [1, 3, 4]?", "answers": ["2"], "why": "3 + 3 uses two; largest-first uses three."}, {"q": "For maximum compatible intervals, sort by start or finish time?", "answers": ["finish", "finish time", "end", "end time"], "why": "Earliest finish leaves the most room for remaining intervals."}], "cards": [{"q": "What must accompany a greedy strategy?", "a": "A correctness argument, such as an exchange argument, and attempts to find counterexamples."}, {"q": "Give a case where largest-coin-first fails.", "a": "Coins 1, 3, 4 and amount 6: greedy uses 4+1+1, but 3+3 is better."}], "exercise": "Add interval (5, 6) to the example. Predict the new count.", "solution": "# The chosen intervals can be (1,3), (3,5), (5,6).\n# The new count is 3.", "reference": "https://docs.python.org/3/tutorial/"}, {"id": "stack", "title": "Remember unfinished work", "subtitle": "Last in, first out.", "prereq": ["counting", "functions"], "day": 22, "body": ["A stack returns the most recently added item first, like undo history. In Python, use a list with append to push and pop to remove the top. Inspect the top with stack[-1] only after checking the stack is nonempty.", "For parentheses, push each opening bracket. On a closing bracket, the most recent unmatched opening must match it. For multiple bracket types, a dictionary can map each closer to its opener.", "If the stack is empty when a closer appears, the sequence is invalid. At the end the stack must be empty, or some opening brackets were never closed. A simple balance counter suffices for one bracket type, but a stack expresses the general matching idea.", "Each character is pushed or popped at most once, so the scan is O(n) time and O(n) worst-case space. This same unfinished-work idea appears in parsing and depth-first traversal."], "code": "def valid(s):\n    stack = []\n    for ch in s:\n        if ch == \"(\":\n            stack.append(ch)\n        else:\n            if not stack:\n                return False\n            stack.pop()\n    return not stack\n\nprint(valid(\"(())\"))", "trace": "Two openers are pushed, then two closers pop them. The empty final stack means True. This example assumes only ( and ) appear.", "trap": "Always check before pop or stack[-1]. Also check for leftover openers after scanning.", "checks": [{"q": "After pushing 2 then 7, what does pop() return?", "answers": ["7"], "why": "A stack is last in, first out."}, {"q": "Is the parenthesis sequence (() valid?", "answers": ["false", "no"], "why": "One opening parenthesis remains unmatched."}], "cards": [{"q": "Which Python list operations implement a stack?", "a": "append pushes; pop removes the most recent item."}, {"q": "What two failure checks does bracket matching need?", "a": "An unmatched or mismatched closer during the scan, and leftover openers at the end."}], "exercise": "Test the function with \"()\", \")(\", and \"((\". Predict True, False, False.", "solution": "# Add these after the valid function:\nprint(valid(\"()\"))\nprint(valid(\")(\"))\nprint(valid(\"((\"))", "reference": "https://docs.python.org/3/tutorial/"}, {"id": "window", "title": "Maintain a moving window", "subtitle": "Reuse work across neighboring ranges.", "prereq": ["prefix", "twopointers", "counting"], "day": 23, "body": ["A window is a contiguous range. When moving a fixed-size window one place right, remove its outgoing value and add its incoming value. Recomputing its whole sum is unnecessary.", "For window size k, initialize the first k-element sum. For each index r from k onward, update total += a[r] - a[r - k]. Track the best after every update.", "A variable-size window needs a valid movement rule. For positive numbers and a sum limit, extending right cannot decrease the sum, and moving left can reduce it. Negative values break that simple monotonic rule.", "Each endpoint moves at most n times in a valid two-pointer window, yielding O(n) time. Explicitly define when the window is valid and whether you update the answer before or after shrinking."], "code": "a = [2, 1, 5, 1, 3]\nk = 3\ntotal = sum(a[:k])\nbest = total\nfor r in range(k, len(a)):\n    total += a[r] - a[r - k]\n    best = max(best, total)\nprint(best)", "trace": "Window sums: 2+1+5 = 8, then 8 + 1 - 2 = 7, then 7 + 3 - 1 = 9. Best is 9.", "trap": "A sum-based variable window that assumes positive input can fail with negative numbers. Fixed-size sum updates still work with negatives.", "checks": [{"q": "What is the best 2-item window sum in [2, 1, 5]?", "answers": ["6"], "why": "The sums are 3 and 6."}, {"q": "How many windows of size 3 exist in a 5-item list?", "answers": ["3"], "why": "There are n - k + 1 start positions."}], "cards": [{"q": "How do you update a fixed-size sum window?", "a": "Add the incoming value and subtract the outgoing value."}, {"q": "Why can negative values break a sum-threshold shrinking rule?", "a": "Extending the window might decrease its sum and shrinking it might increase it."}], "exercise": "Change k to 2 in the example and predict the maximum sum.", "solution": "# Window sums are 3, 6, 6, 4. The maximum is 6.", "reference": "https://docs.python.org/3/tutorial/"}, {"id": "recursion", "title": "Solve a smaller version", "subtitle": "Base cases and the call stack.", "prereq": ["functions", "stack"], "day": 25, "body": ["Recursion means a function calls itself on a smaller or simpler instance. Two pieces are essential: a base case that returns directly, and a recursive step that moves toward that base case.", "Each call pauses until its inner call returns. The call stack stores these unfinished calls. factorial(3) waits for factorial(2), which waits for factorial(1), then results unwind upward.", "Recursion is a way to organize work, not automatically an optimization. If subproblems repeat, plain recursion can do enormous redundant work. Dynamic programming will help with that.", "Python limits recursion depth. For long graph paths, prefer an explicit stack instead of assuming arbitrary depth will work. Do not raise the recursion limit without considering actual stack resources."], "code": "def factorial(n):\n    if n <= 1:\n        return 1\n    return n * factorial(n - 1)\n\nprint(factorial(4))", "trace": "factorial(4) becomes 4 × 3 × 2 × 1 = 24. The n <= 1 case stops further calls. This example assumes a nonnegative integer.", "trap": "A missing base case or a recursive argument that never shrinks leads to runaway recursion.", "checks": [{"q": "What is factorial(3)?", "answers": ["6"], "why": "3 × 2 × 1 = 6."}, {"q": "What stops recursion: a base case or a print?", "answers": ["base case", "a base case"], "why": "The base case returns without making another recursive call."}], "cards": [{"q": "What two things must every terminating recursive design establish?", "a": "A base case and progress toward it on every recursive path."}, {"q": "What is stored on the call stack?", "a": "The unfinished calls and the local state needed to resume them."}], "exercise": "Write a recursive sum from 1 through n, with base case n == 0. Test n = 4.", "solution": "def total(n):\n    if n == 0:\n        return 0\n    return n + total(n - 1)\n\nprint(total(4))  # 10", "reference": "https://docs.python.org/3/tutorial/"}, {"id": "bfs", "title": "Explore in layers", "subtitle": "Graphs, queues, and shortest unweighted paths.", "prereq": ["counting", "stack"], "day": 26, "body": ["A graph has vertices (places) and edges (connections). An adjacency list stores each vertex’s neighbors. For an undirected edge u—v, store v among u’s neighbors and u among v’s neighbors.", "Breadth-first search explores all vertices one edge away, then two edges away, and so on. A queue provides first-in, first-out order. collections.deque supports append and popleft efficiently.", "Mark a vertex discovered when you enqueue it, not later when you remove it. This prevents repeated enqueueing. Set a neighbor’s distance to the current distance plus one when it is first discovered.", "BFS computes shortest edge counts when all edges have equal weight. It does not solve arbitrary weighted shortest paths. With adjacency lists it visits O(V + E) total graph structure, where V counts vertices and E counts edges."], "code": "from collections import deque\ngraph = [[1, 2], [0, 3], [0], [1]]\ndist = [-1] * len(graph)\ndist[0] = 0\nq = deque([0])\nwhile q:\n    v = q.popleft()\n    for u in graph[v]:\n        if dist[u] == -1:\n            dist[u] = dist[v] + 1\n            q.append(u)\nprint(dist)", "trace": "Start at 0. Discover 1 and 2 at distance 1. From 1 discover 3 at distance 2. Final distances: [0, 1, 1, 2].", "trap": "list.pop(0) shifts the remaining list and can be slow. Use deque.popleft() for a queue.", "checks": [{"q": "What is the example distance from vertex 0 to vertex 3?", "answers": ["2"], "why": "The path is 0 → 1 → 3."}, {"q": "Does BFS use a queue or a stack?", "answers": ["queue"], "why": "First-in, first-out order keeps exploration in layers."}], "cards": [{"q": "When should BFS mark a vertex visited?", "a": "When it is first enqueued, so other paths do not enqueue it again."}, {"q": "When does BFS give shortest paths?", "a": "When all edges have equal weight, usually counting edges in an unweighted graph."}], "exercise": "Add an undirected edge between 0 and 3 in the example and predict the new distance to 3.", "solution": "# Add 3 to graph[0] and 0 to graph[3] before BFS.\n# dist[3] will then be 1.", "reference": "https://docs.python.org/3/library/collections.html#collections.deque"}, {"id": "dfs", "title": "Explore one path at a time", "subtitle": "Reachability and connected components.", "prereq": ["bfs", "recursion"], "day": 27, "body": ["Depth-first search follows a path deeply before exploring alternatives. Use recursion or an explicit stack. For Python graphs with potentially deep paths, an explicit stack avoids recursion-depth failures.", "Start with one vertex on the stack and in a visited set. Pop a vertex, then push any unvisited neighbors and mark them visited. This determines which vertices are reachable from the start.", "To count connected components in an undirected graph, scan all vertices. Whenever one is still unvisited, start a new traversal and increase the component count. Isolated vertices count as components too.", "DFS and BFS both take O(V + E) on adjacency lists, but DFS does not generally find shortest paths. Choose according to the property you need, not familiarity with a template."], "code": "graph = [[1], [0], [3], [2]]\nseen = set()\ncomponents = 0\nfor start in range(len(graph)):\n    if start in seen:\n        continue\n    components += 1\n    stack = [start]\n    seen.add(start)\n    while stack:\n        v = stack.pop()\n        for u in graph[v]:\n            if u not in seen:\n                seen.add(u)\n                stack.append(u)\nprint(components)", "trace": "The first traversal reaches 0 and 1. The next unseen start is 2, which reaches 3. Two components exist.", "trap": "If you only traverse from vertex 0, disconnected vertices are never visited. Counting components needs the outer loop.", "checks": [{"q": "How many components are in the example graph?", "answers": ["2"], "why": "There are groups {0,1} and {2,3}."}, {"q": "Does ordinary DFS guarantee a shortest unweighted path? Answer yes or no.", "answers": ["no"], "why": "DFS may follow a long path first; BFS is the shortest-edge-count traversal."}], "cards": [{"q": "How do you count connected components?", "a": "Run a traversal from each still-unvisited vertex and count how many traversals you start."}, {"q": "Why prefer iterative DFS on very deep Python graphs?", "a": "An explicit stack avoids Python’s recursion-depth limit."}], "exercise": "Append an empty neighbor list to the graph. Predict the component count.", "solution": "# graph.append([]) adds one isolated vertex.\n# The component count becomes 3.", "reference": "https://docs.python.org/3/tutorial/"}, {"id": "dp", "title": "Remember smaller answers", "subtitle": "Dynamic programming from a recurrence.", "prereq": ["recursion", "lists"], "day": 29, "body": ["Dynamic programming reuses answers to overlapping subproblems. Start by defining a state in one precise sentence. Then identify base cases, a transition from smaller states, and an order in which those smaller states are already available.", "For climbing n stairs with steps of size 1 or 2, let dp[i] be the number of ways to reach stair i. The final move came from i - 1 or i - 2, so dp[i] = dp[i - 1] + dp[i - 2]. The two groups do not overlap.", "Set dp[0] = 1 for the one empty way to take no steps, and dp[1] = 1. Fill upward. This is bottom-up DP. Memoization is a top-down recursive alternative that caches each state’s answer.", "Before reducing memory, make the full state table correct. Count states and work per state to estimate time. This example has O(n) states, O(1) work each, and O(n) space; only two previous values are needed if you later optimize."], "code": "n = 5\ndp = [0] * (n + 1)\ndp[0] = 1\nfor i in range(1, n + 1):\n    dp[i] = dp[i - 1]\n    if i >= 2:\n        dp[i] += dp[i - 2]\nprint(dp)", "trace": "The table is [1, 1, 2, 3, 5, 8]. At stair 5, there are 5 ways arriving from stair 4 and 3 from stair 3.", "trap": "Memorizing a recurrence without a state definition makes it easy to count the wrong thing or double-count.", "checks": [{"q": "How many ways reach stair 4 using steps of size 1 or 2?", "answers": ["5"], "why": "dp[4] = dp[3] + dp[2] = 3 + 2."}, {"q": "What is dp[0] for this counting interpretation?", "answers": ["1"], "why": "There is one empty sequence of moves."}], "cards": [{"q": "What should you define before writing a DP recurrence?", "a": "The exact meaning of each state, including what its indices represent."}, {"q": "What are the four basic DP design pieces?", "a": "State definition, base cases, transition, and evaluation order."}], "exercise": "Change n to 6 and predict dp[6] before running.", "solution": "# dp[6] = dp[5] + dp[4] = 8 + 5 = 13.", "reference": "https://docs.python.org/3/tutorial/"}, {"id": "heap", "title": "Keep the next best item ready", "subtitle": "Priority queues and repeated minima.", "prereq": ["sorting", "complexity"], "day": 31, "body": ["A heap maintains a partial order that makes the smallest item easy to retrieve. It is not a fully sorted list. Python’s heapq functions operate on a normal list as a min-heap.", "heapify(a) builds a heap in O(n). heappush(a, x) inserts in O(log n). heappop(a) removes and returns the minimum in O(log n). The minimum is a[0] in O(1), provided the heap is nonempty.", "Use a heap when values arrive or change and you repeatedly need the next smallest. If you only need to sort everything once, a normal sort is simpler. To simulate a max-heap with widely supported operations, store negative values.", "For top k largest values, maintain a min-heap of at most k elements. The root is the smallest retained candidate. A larger incoming value can replace it; smaller values can be ignored."], "code": "import heapq\nheap = [8, 2, 5]\nheapq.heapify(heap)\nheapq.heappush(heap, 1)\nprint(heapq.heappop(heap))\nprint(heapq.heappop(heap))", "trace": "After adding 1, the first removal returns 1. The next returns 2. Remaining internal positions need not be sorted.", "trap": "Never assume iterating over a heap yields sorted order. Pop repeatedly if you need ordered removal.", "checks": [{"q": "What is the first pop from a min-heap containing 8, 2, 5?", "answers": ["2"], "why": "The minimum is removed first."}, {"q": "Is a heap’s full internal list necessarily sorted? Answer yes or no.", "answers": ["no"], "why": "Only the parent-child heap order is guaranteed."}], "cards": [{"q": "When does a heap help more than sorting once?", "a": "When you repeatedly insert values and retrieve the current minimum or maximum."}, {"q": "What are heappush and heappop time complexities?", "a": "O(log n) each for a heap of size n."}], "exercise": "Use a heap to print the numbers [7, 2, 9, 1] in ascending order.", "solution": "import heapq\na = [7, 2, 9, 1]\nheapq.heapify(a)\nwhile a:\n    print(heapq.heappop(a))", "reference": "https://docs.python.org/3/library/heapq.html"}, {"id": "contest", "title": "Turn knowledge into points", "subtitle": "Read, choose, implement, test, and upsolve.", "prereq": ["if", "loops", "lists"], "day": 20, "body": ["A contest tests decisions under a clock as well as algorithms. First scan the problems and identify ones whose statements and constraints you understand. An A label is not a guarantee, but easier-looking tasks deserve an initial look.", "Before coding, summarize the input, output, and condition in your own words. Solve a tiny example by hand. Write an approach, why it works, and its time cost. If you cannot do that yet, more code usually adds confusion.", "Submit after testing the sample plus boundaries. Wrong Answer means investigate a counterexample and the specification. Runtime Error means inspect indexing, empty structures, division, input format, and recursion. Time Limit Exceeded means estimate work before making micro-optimizations.", "If you are stuck for roughly 15–20 minutes without a new idea, consider moving to another task. After a practice contest, upsolve: finish unsolved approachable problems, use a hint if needed, close the explanation, and implement again. Write the missed idea as a recall card. Follow the actual event’s rules on outside assistance."], "code": "def solve():\n    n = int(input())\n    print(n * 2)\n\nsolve()", "trace": "This is only an input/output skeleton for a toy doubling task. Replace the body with the actual problem’s logic, and call solve once unless the statement specifies a different structure.", "trap": "The first goal is correct solutions you can reproduce, not a submission count. Self-reported practice success is not a Codeforces rating estimate.", "checks": [{"q": "A solution exceeds the time limit. Which should you inspect first: complexity or variable names?", "answers": ["complexity"], "why": "Estimate the amount of work before cosmetic changes."}, {"q": "After reading an editorial, should you copy it or reimplement from memory?", "answers": ["reimplement", "reimplement from memory", "from memory"], "why": "Reconstruction reveals which parts you actually understand."}], "cards": [{"q": "What should you do before coding a contest solution?", "a": "Restate the task, solve a tiny case, choose an approach, justify it, and estimate complexity."}, {"q": "What belongs in an upsolve note?", "a": "The missed idea, the counterexample or bug, and one concrete prevention rule."}], "exercise": "Write your own five-step pre-submission checklist, then use it in a 45-minute practice contest.", "solution": "# 1. Confirm input format.\n# 2. Confirm the required output.\n# 3. Check smallest and equality cases.\n# 4. Estimate time and memory.\n# 5. Remove debug output and submit.", "reference": "https://docs.python.org/3/tutorial/"}], "problems": [{"id": "cf4A", "code": "4A", "title": "Watermelon", "topic": "if", "platform": "Codeforces", "level": "800", "url": "https://codeforces.com/problemset/problem/4/A"}, {"id": "cf71A", "code": "71A", "title": "Way Too Long Words", "topic": "strings", "platform": "Codeforces", "level": "800", "url": "https://codeforces.com/problemset/problem/71/A"}, {"id": "cf231A", "code": "231A", "title": "Team", "topic": "loops", "platform": "Codeforces", "level": "800", "url": "https://codeforces.com/problemset/problem/231/A"}, {"id": "cf282A", "code": "282A", "title": "Bit++", "topic": "strings", "platform": "Codeforces", "level": "800", "url": "https://codeforces.com/problemset/problem/282/A"}, {"id": "cf50A", "code": "50A", "title": "Domino piling", "topic": "math", "platform": "Codeforces", "level": "800", "url": "https://codeforces.com/problemset/problem/50/A"}, {"id": "cf158A", "code": "158A", "title": "Next Round", "topic": "lists", "platform": "Codeforces", "level": "800", "url": "https://codefo function checkAnswer(e,id,i){e.preventDefault();const answer=new FormData(e.target).get('answer');if(!String(answer).trim())return;const l=L(id);if(!ready(id))return;const c=l.checks[i],q=state.quiz[id]||{passed:[],wrong:0};let ok=c.answers.some(a=>normalize(a)===normalize(answer));if(ok&&!q.passed.includes(i))q.passed.push(i);if(!ok){q.wrong++;q.passed=q.passed.filter(x=>x!==i);ensureCard('check-'+id+'-'+i,id,c.q,c.why,now());}state.quiz[id]=q;touch();save();let el=$('#feedback-'+i);el.className='feedback '+(ok?'good':'bad');el.textContent=(ok?'✓ Correct. ':'Try again. ')+c.why;$('#complete-lesson').disabled=q.passed.length<l.checks.length;}

function problemModal(id){const p=P(id),l=L(p.topic),a=lastAttempt(id),inMock=state.activeMock?.pids.includes(id)&&now()<state.activeMock.start+state.activeMock.duration*60000;modal(modalHead(esc(p.title))+`<div class="flex wrap" style="margin-bottom:17px"><span class="pill">${p.platform} · ${p.code}</span><span class="pill green">${p.level}</span></div>${!problemReady(p)?`<div class="banner warn">This is a preview. ${p.platform==='LeetCode'&&!learned('functions')?'Complete the functions lesson for LeetCode’s method format. ':''}Learn <a href="#learn/${p.topic}" onclick="closeModal()">${esc(l.title)}</a> before attempting it.</div>`:''}<p class="small muted">Open the original statement and submit there. Then return here to log the outcome. Results are self-reported; the site does not read your submissions.</p><a class="btn primary" style="margin:17px 0" href="${p.url}" target="_blank" rel="noopener noreferrer">Open on ${p.platform} ${icon('up',14)}</a>${inMock?'<div class="banner">Mock in progress. Hints are hidden here until you finish the timer.</div>':`<details><summary>Before coding: a thinking checklist</summary><ol class="list-clean"><li>Restate the required output in one sentence.</li><li>Work one tiny example by hand.</li><li>Identify the constraints and boundary cases.</li><li>Explain your approach before writing it.</li></ol></details><details><summary>Concept hint 1 · Find the idea</summary><p class="small muted">This task connects to ${esc(l.title.toLowerCase())}. ${esc(l.body[0])}</p></details><details><summary>Concept hint 2 · Rebuild the pattern</summary><p class="small muted">${esc(l.body[1])}</p><p class="small muted">This is a concept hint, not a complete solution to this particular problem. Check the original statement carefully.</p><button class="textbtn" style="margin-top:10px" onclick="go('learn/${p.topic}')">Revisit the worked lesson ${icon('arrow',13)}</button></details>`}<form onsubmit="logAttempt(event,'${id}')" style="margin-top:22px"><div class="field"><label for="outcome">How did the attempt go?</label><select id="outcome" name="outcome"><option value="independent">Accepted independently — no hints or solution</option><option value="hinted">Accepted with a hint or editorial</option><option value="stuck" selected>Not accepted yet / still stuck</option></select></div><div class="grid two"><div class="field"><label for="minutes">Minutes spent</label><input id="minutes" name="minutes" type="number" min="1" max="600" value="25" required></div><div class="field"><label for="error">Main learning point</label><select id="error" name="error">${errors.map(x=>`<option>${x}</option>`).join('')}</select></div></div><div class="field"><label for="attempt-note">What was the idea or mistake?</label><textarea id="attempt-note" name="note" placeholder="Example: I missed the equality case. Next time I will test exactly at the threshold." maxlength="5000" required></textarea></div><button class="btn primary">Save attempt & adapt plan ${icon('check',14)}</button>${a?`<p class="small muted" style="margin-top:10px">Last attempt: ${new Date(a.at).toLocaleDateString()} · ${a.outcome}</p>`:''}</form>`)}
function logAttempt(e,pid){e.preventDefault();const f=new FormData(e.target),p=P(pid);const a={pid,outcome:f.get('outcome'),minutes:Number(f.get('minutes')),error:f.get('error'),note:String(f.get('note')).trim(),at:now()};if(!a.note||!finite(a.minutes,1,600))return;state.attempts.push(a);if(a.outcome!=='independent'){state.journal.push({id:'j-'+now(),title:p.title,note:a.error+': '+a.note,at:a.at,pid});ensureCard('problem-'+pid,p.topic,'Without the solution, explain your approach to '+p.title+'.',a.note+'\n\nReturn to the original problem and reconstruct your code.',now()+86400000)}touch();save();closeModal();toast('Attempt saved. Your recommendations and recall queue have updated.');render()}
let reviewCurrent=null,reviewRevealed=false;
function reviewView(){let due=dueCards();if(!due.some(c=>c.id===reviewCurrent))reviewCurrent=due[0]?.id||null;const c=state.cards.find(c=>c.id===reviewCurrent);reviewRevealed=false;return pageHead('SPACED RECALL','Make understanding last.','Retrieve before you reveal. Rate how well you remembered; the next review moves with your answer.',`<div class="flex wrap"><button class="btn" onclick="manageCards()">Manage cards</button><button class="btn" onclick="addCard()">+ Create a card</button></div>`)+(c?`<div class="between small muted" style="max-width:770px;margin:auto"><span>${due.length} due now · ${state.cards.length} total cards</span><span>No timer. Think it through.</span></div><div class="reviewcard"><div class="review-top"><span class="eyebrow muted">${esc(title(c.topic))}</span><span class="small muted">${c.reps?'Returning concept':'First recall'}</span></div><div class="review-front"><h2>${esc(c.q)}</h2><textarea id="recall-draft" aria-label="Your recalled answer" placeholder="Say it aloud, or type what you remember here… (optional)"></textarea><div id="review-reveal"><button class="btn primary" style="margin-top:23px" onclick="revealCard()">Reveal answer ${icon('cards',15)}</button><p class="small muted" style="margin-top:12px">Try an answer first, even an incomplete one.</p></div></div></div>`:`<div class="card empty" style="max-width:770px;margin:30px auto">${icon('cards',38)}<h2>${state.cards.length?'You’re up to date.':'Build a memory worth keeping.'}</h2><p>${state.cards.length?'Your next scheduled review is '+new Date(Math.min(...state.cards.map(c=>c.due))).toLocaleString()+'. Apply a concept in a problem while it rests.':'Finish a lesson and its recall cards appear here. You can also turn a personal mistake into a card.'}</p><button class="btn primary" onclick="go('${state.cards.length?'practice':`learn/${nextLesson().lesson.id}`}')">${state.cards.length?'Practice a concept':'Start the first lesson'} ${icon('arrow',15)}</button></div>`)+`<div class="grid two" style="max-width:770px;margin:22px auto"><div class="card pad"><h3>The schedule, explained</h3><p class="small muted" style="margin-top:10px">Again: retry in 10 minutes. Hard: at least 1 day. Good: 1 day, then 3, then a growing interval. Easy: at least 4 days. Intervals cap at 60 days; “Again” resets successful recall count.</p></div><div class="card pad"><h3>Recall is one part of mastery</h3><p class="small muted" style="margin-top:10px">These are simple, transparent scheduling rules inspired by spaced practice. They are not Anki’s scheduler or a measured forgetting curve. Solving a fresh problem is the transfer test.</p></div></div>`}
function schedule(c,r,t=now()){let n={...c};if(r==='again'){n.interval=0;n.reps=0;n.lapses++;n.ease=Math.max(1.3,n.ease-.2);n.due=t+600000;return n}if(r==='hard'){n.interval=Math.max(1,Math.round(n.interval*1.2));n.ease=Math.max(1.3,n.ease-.15)}else if(r==='good'){n.interval=n.reps===0?1:n.reps===1?3:Math.max(1,Math.round(n.interval*n.ease));n.reps++}else if(r==='easy'){n.interval=Math.max(4,Math.round(n.interval*n.ease*1.3));n.ease=Math.min(3,n.ease+.15);n.reps++}n.interval=Math.min(60,n.interval);n.due=t+n.interval*86400000;return n}
function revealCard(){let c=state.cards.find(x=>x.id===reviewCurrent);if(!c)return;reviewRevealed=true;$('#review-reveal').innerHTML=`<div class="review-answer">${esc(c.a)}</div><div class="ratings">${['again','hard','good','easy'].map(r=>{let n=schedule(c,r);return `<button class="rating" onclick="rateCard('${r}')">${r[0].toUpperCase()+r.slice(1)}<span>${r==='again'?'10 minutes':n.interval+' day'+(n.interval===1?'':'s')}</span></button>`}).join('')}</div><p class="small muted" style="margin-top:14px">Again = forgot · Hard = struggled · Good = recalled · Easy = effortless</p>`}
function rateCard(r){if(!reviewRevealed||!['again','hard','good','easy'].includes(r))return;let i=state.cards.findIndex(c=>c.id===reviewCurrent);if(i<0)return;state.cards[i]=schedule(state.cards[i],r);touch();save();reviewCurrent=null;render();toast(r==='again'?'Scheduled again in 10 minutes. Review the idea, then return.':'Next review scheduled. Keep going when you’re ready.')}

function roadmapView(){return pageHead('YOUR 40-DAY BLUEPRINT','A direction, not a deadline trap.','The roadmap gives each day a purpose. Your daily coach repeats prerequisites when needed; advancing the calendar does not mark a lesson learned.')+`<div class="banner">Stage 1: <b>${dateLabel(state.profile.stage1)}</b> · Stage 2: <b>${dateLabel(state.profile.stage2)}</b>. Dates default to 20 and 40 days after setup. <button class="textbtn" onclick="go('settings')">Edit your actual competition dates ${icon('arrow',12)}</button></div>`+[[1,7,'01 / Build a Python foundation'],[8,17,'02 / Learn the core patterns'],[18,20,'03 / Rehearse for stage 1'],[21,30,'04 / Extend your toolkit'],[31,40,'05 / Consolidate for stage 2']].map(([a,b,h])=>`<div class="roadsection"><h2 style="margin-bottom:17px">${h}</h2><div class="roadgrid">${ROADMAP.filter(r=>r.day>=a&&r.day<=b).map(r=>`<button class="roadcard ${r.day===currentDay()?'today':''}" onclick="roadDay(${r.day})"><span class="eyebrow muted" style="font-size:10px">DAY ${String(r.day).padStart(2,'0')} ${r.day===currentDay()?'· TODAY':''}</span><b>${esc(r.title)}</b><span>${learned(r.topic)?'Concept learned':'View training plan'} ${icon('arrow',12)}</span></button>`).join('')}</div></div>`).join('')}

function journalView(){return pageHead('THE MISTAKE JOURNAL','Every mistake can teach twice.','Capture what broke and the rule that will prevent it. Hinted and unfinished problem attempts create entries automatically.',`<button class="btn primary" onclick="addJournal()">+ Add reflection</button>`)+(state.journal.length?`<div class="card">${[...state.journal].reverse().map(j=>`<div class="journalrow"><div class="between"><h3>${esc(j.title)}</h3><span class="small muted">${new Date(j.at).toLocaleDateString()}</span></div><p>${esc(j.note)}</p><div class="flex wrap" style="margin-top:16px"><button class="btn small" onclick="journalToCard('${esc(j.id)}')">Make a recall card ${icon('cards',13)}</button>${j.pid?`<button class="btn small" onclick="problemModal('${j.pid}')">Reattempt ${icon('up',13)}</button>`:''}<button class="textbtn" onclick="editJournal('${esc(j.id)}')">Edit note</button></div></div>`).join('')}</div>`:`<div class="card empty">${icon('journal',36)}<h2>Keep the lesson behind the mistake.</h2><p>“I am bad at loops” is not actionable. “I reset the counter inside the loop; initialize it before the loop” gives you something to change.</p><button class="btn primary" onclick="addJournal()">Write your first reflection</button></div>`)}

function progressView(){let independent=state.attempts.filter(a=>a.outcome==='independent'),unique=new Set(independent.map(a=>a.pid)).size,minutes=state.attempts.reduce((s,a)=>s+a.minutes,0),recall=state.cards.filter(c=>c.reps>=2).length;return pageHead('THE EVIDENCE BOARD','Track what you can reproduce.','These measures reflect your logged practice, not an official rating or a guarantee of competition performance.')+`<div class="stats"><div class="stat"><div class="stat-label">Unique independent solves</div><div class="value">${unique}</div><div class="small muted">${state.attempts.length} total attempts</div></div><div class="stat"><div class="stat-label">Lessons completed</div><div class="value">${Object.keys(state.completed).length}<span>/ 24</span></div><div class="small muted">Two correct checks per lesson</div></div><div class="stat"><div class="stat-label">Repeated successful recall</div><div class="value">${recall}<span>cards</span></div><div class="small muted">At least two Good / Easy ratings</div></div><div class="stat"><div class="stat-label">Problem time logged</div><div class="value">${(minutes/60).toFixed(1)}<span>hours</span></div><div class="small muted">Practice time you entered</div></div></div><div class="grid cols"><div class="card pad"><h2>Your concept profile</h2><p class="small muted" style="margin:9px 0 22px">30 points for lesson checks + up to 40 for two distinct independent solves + up to 30 for repeated card recall. This is a planning score, not a calibrated mastery estimate.</p>${[...LESSONS].sort((a,b)=>a.day-b.day).map(l=>`<div class="progressrow"><a href="#learn/${l.id}">${esc(l.title)}</a><div class="bar"><i style="width:${skillScore(l.id)}%"></i></div><span class="mono muted">${skillScore(l.id)}%</span></div>`).join('')}</div><div><div class="card pad"><h2>40 days of showing up</h2><p class="small muted" style="margin:10px 0 17px">A square lights up when you log an attempt, answer a check, review a card, or reflect.</p><div class="activity">${Array.from({length:40},(_,i)=>{let d=plusDays(state.profile.start,i);return `<i class="${state.activity[d]?'on':''}" title="${d}: ${state.activity[d]||0} actions" aria-label="${d}: ${state.activity[d]||0} actions"></i>`}).join('')}</div></div><div class="spacer"></div><div class="card pad"><h2>The next useful move</h2><p class="small muted" style="margin-top:12px">${esc(nextLesson().reason)}</p><button class="btn primary" style="margin-top:18px" onclick="go('learn/${nextLesson().lesson.id}')">${esc(nextLesson().lesson.title)} ${icon('arrow',14)}</button></div><div class="spacer"></div><div class="card pad"><h3>Today’s stretch ambition</h3><p class="small muted" style="margin-top:10px">${state.attempts.filter(a=>P(a.pid).platform==='Codeforces'&&localDay(new Date(a.at))===today()).length} / ${state.profile.cfGoal} Codeforces attempts<br>${state.attempts.filter(a=>P(a.pid).platform==='LeetCode'&&localDay(new Date(a.at))===today()).length} / ${state.profile.lcGoal} LeetCode attempts</p><p class="small muted">Repeated attempts count here. These optional volume goals do not override your learning plan.</p></div></div></div>`}
function arenaView(){let m=state.activeMock;return pageHead('THE CONTEST ROOM','Practice making decisions.','A local timed rehearsal using unseen tasks from concepts you have learned. Submit on the original platforms, then log your results.')+(m?`<div class="card pad" style="text-align:center"><span class="pill green">${m.duration}-minute rehearsal</span><div id="mock-timer" class="timer" style="margin-top:20px"></div><div class="timerlabel">Time remaining</div><p class="small muted">This is a practice session, not an official virtual contest. Hints in problem dialogs stay hidden while time remains.</p><button class="btn" style="margin-top:20px" onclick="finishMock()">Finish & reflect</button></div><div class="spacer"></div><div class="grid ${m.pids.length>1?'two':''}">${m.pids.map((id,i)=>{let p=P(id),a=state.attempts.filter(a=>a.pid===id&&a.at>=m.start).at(-1);return `<div class="card pad"><div class="eyebrow muted">PROBLEM ${String.fromCharCode(65+i)}</div><h2 style="margin:12px 0">${esc(p.title)}</h2><p class="small muted">${p.platform} · ${p.level} · ${a?a.outcome:'Not logged'}</p><button class="btn primary" style="margin-top:18px" onclick="problemModal('${id}')">Open task ${icon('up',14)}</button></div>`}).join('')}</div>`:`<div class="grid cols"><div class="card pad"><h2>Set up a rehearsal</h2><p class="muted" style="margin:12px 0 23px">Begin after you can read input, use conditions and loops, and make independent attempts. The selection avoids every problem already in your attempt history or previous mocks.</p><form onsubmit="startMock(event)"><div class="field"><label for="mock-length">Session length</label><select id="mock-length" name="duration"><option value="45">45 minutes · first rehearsal</option><option value="60">60 minutes · mixed practice</option><option value="90">90 minutes · longer rehearsal</option></select></div><button class="btn primary">Start rehearsal ${icon('play',14)}</button></form></div><div class="card pad"><h2>Your contest routine</h2><ol class="list-clean"><li>Read all selected tasks first.</li><li>Start with the clearest solvable one.</li><li>State an approach and test a small case.</li><li>Change tasks if you stop making progress.</li><li>Upsolve and record one concrete lesson.</li></ol><a href="https://codeforces.com/contests" target="_blank" rel="noopener noreferrer" class="textbtn">Official contests and virtual participation ${icon('up',13)}</a></div></div>`)+`<div class="spacer"></div><div class="card pad"><h2>Rehearsal history</h2>${state.mocks.length?[...state.mocks].reverse().map(m=>`<div class="quick-link"><span>${new Date(m.start).toLocaleDateString()} · ${m.duration} min planned · ${m.pids.length} tasks</span><span class="muted">${m.solved||0} independent · ${(m.elapsed||0).toFixed(0)} min elapsed</span></div>`).join(''):'<p class="small muted" style="margin-top:12px">Your first completed rehearsal will appear here.</p>'}</div>`}
function startMock(e){e.preventDefault();if(!['if','loops','lists'].every(learned)){toast('Complete conditions, loops, and lists before a timed rehearsal.');return}let used=new Set([...state.attempts.map(a=>a.pid),...state.mocks.flatMap(m=>m.pids)]);let pool=PROBLEMS.filter(p=>problemReady(p)&&!used.has(p.id));pool.sort(()=>Math.random()-.5);pool.sort((a,b)=>(a.platform==='Codeforces'?Number(a.level):a.level==='Easy'?900:1300)-(b.platform==='Codeforces'?Number(b.level):b.level==='Easy'?900:1300));let pids=pool.slice(0,3).map(p=>p.id);if(!pids.length){toast('No unseen tasks are available in learned concepts. Learn another concept or use an official virtual contest.');return}state.activeMock={start:now(),duration:Number(new FormData(e.target).get('duration')),pids};save();render();toast('Rehearsal started. The timer continues across reloads.')}
