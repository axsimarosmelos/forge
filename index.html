function saveCheckin(e){e.preventDefault();let f=new FormData(e.target);state.checkins[today()]={minutes:Number(f.get('minutes')),energy:f.get('energy')};save();closeModal();go('today');toast('Today’s plan now fits your time and energy.')}
function settingsView(){let p=state.profile;return pageHead('YOUR LEARNING SPACE','Make the plan yours.','Set your actual dates and available time. The coach adjusts from your recorded results each time you use the site.')+`<div class="grid two"><div class="card pad"><h2>Personalize your plan</h2><form style="margin-top:22px" onsubmit="saveSettings(event)"><div class="field"><label for="name">What should we call you?</label><input id="name" name="name" value="${esc(p.name)}" maxlength="80" placeholder="Your name"></div><div class="field"><label for="daily-minutes">Daily time budget, in minutes</label><input id="daily-minutes" name="minutes" type="number" min="30" max="720" value="${p.minutes}" required></div><div class="field"><label for="start-date">Journey start date</label><input id="start-date" name="start" type="date" value="${p.start}" required></div><div class="field"><label for="event-name">Competition name</label><input id="event-name" name="event" value="${esc(p.event)}" maxlength="200"></div><div class="field"><label for="event-url">Competition link (optional)</label><input id="event-url" name="eventUrl" type="url" value="${esc(p.eventUrl)}" placeholder="https://…" maxlength="500"></div><div class="grid two"><div class="field"><label for="stage1">Stage 1 date</label><input id="stage1" name="stage1" type="date" value="${p.stage1}" required></div><div class="field"><label for="stage2">Stage 2 date</label><input id="stage2" name="stage2" type="date" value="${p.stage2}" required></div></div><details><summary>Your optional daily volume ambition</summary><p class="small muted" style="margin:10px 0">Saved separately from the core plan. At 25 minutes per attempt, 45 problems take almost 19 hours before lessons or reviews. Start with sustainable, independently understood work.</p><div class="grid two"><div class="field"><label for="cf-goal">Codeforces</label><input id="cf-goal" name="cfGoal" type="number" min="0" max="50" value="${p.cfGoal}" required></div><div class="field"><label for="lc-goal">LeetCode</label><input id="lc-goal" name="lcGoal" type="number" min="0" max="50" value="${p.lcGoal}" required></div></div></details><div id="settings-error" class="feedback bad" role="alert"></div><button class="btn primary" style="margin-top:20px">Save settings ${icon('check',14)}</button></form></div><div><div class="card pad"><h2>Your progress travels with you.</h2><p class="small muted" style="margin-top:12px">Progress is stored in this browser on this device. It does not sync automatically, and private browsing or clearing browser data can remove it. Export a JSON backup regularly and import it on another device. Use the same webpage location to retain its browser storage.</p><div class="flex wrap" style="margin-top:20px"><button class="btn primary" onclick="exportData()">Export progress ${icon('download',14)}</button><button class="btn" onclick="$('#import-file').click()">Import backup</button><input type="file" id="import-file" accept=".json,application/json" class="hide" onchange="importData(this.files[0]);this.value=''" aria-label="Choose progress backup"></div></div><div class="spacer"></div><div class="card pad"><h2>How personalization works</h2><p class="small muted" style="margin-top:12px">This is a local, rule-based learning coach. It uses prerequisite completion, independent versus helped attempts, card ratings, and today’s energy and time. It does not generate new lessons, chat with an AI, access your accounts, or run in the background.</p><p class="small muted">A failed check creates a recall card. A helped or stuck attempt creates a reflection and a next-day card. Weak concepts are revisited before new ones. Quiz answers alone never imply contest proficiency.</p></div><div class="spacer"></div><div class="card pad"><h2>Starting assumptions</h2><p class="small muted" style="margin-top:12px">Python 3 · beginner · 3 hours daily by default · stage 1 in 20 days · stage 2 in 40 days. The curriculum is general competitive programming preparation; your event’s syllabus and rules may need a different emphasis.</p><p class="small muted">You can preview all lessons. The 40-day roadmap is a suggested progression, not a guarantee of learning speed or winning.</p></div><div class="spacer"></div><div class="card pad"><h3>Start over</h3><p class="small muted" style="margin:10px 0 15px">This removes this browser’s Forge progress. Export a backup first.</p><button class="btn danger small" onclick="resetDialog()">Reset progress…</button></div></div></div>`}
function saveSettings(e){e.preventDefault();let f=new FormData(e.target),p={...state.profile};for(const k of ['name','event','eventUrl','start','stage1','stage2'])p[k]=String(f.get(k)).trim();for(const k of ['minutes','cfGoal','lcGoal'])p[k]=Number(f.get(k));try{validate({...state,profile:p})}catch(err){$('#settings-error').textContent='Use valid dates with stage 1 after the start and stage 2 after stage 1, and a valid HTTP(S) event link if supplied.';return}state.profile=p;save();toast('Your settings are saved. Today’s plan has been updated.');go('today')}
function download(name,text,type){let u=URL.createObjectURL(new Blob([text],{type}));let a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportData(){download('forge-progress-'+today()+'.json',JSON.stringify(state,null,2),'application/json');toast('Progress backup downloaded. Keep it somewhere you trust.')}
let pendingImport=null;
async function importData(file){if(!file)return;if(file.size>100000000){toast('That backup is too large. Choose a Forge JSON backup under 100 MB.');return}try{let candidate=validate(JSON.parse(await file.text()));pendingImport=candidate;modal(modalHead('Restore this backup?')+`<p>This backup contains ${candidate.attempts.length} attempts, ${candidate.cards.length} cards, and ${Object.keys(candidate.completed).length} completed lessons.</p><p class="small muted" style="margin-top:12px">Restoring replaces the current progress in this browser. Export your current progress first if you want to keep both.</p><div class="flex wrap" style="margin-top:22px"><button class="btn" onclick="exportData()">Export current progress</button><button class="btn primary" onclick="confirmImport()">Restore backup</button></div>`)}catch(e){toast('Could not import: '+e.message)}}
function confirmImport(){if(!pendingImport)return;state=pendingImport;pendingImport=null;reviewCurrent=null;save();closeModal();go('today');toast('Backup restored. Your learning plan is ready.')}
function resetDialog(){modal(modalHead('Reset this browser’s progress?')+`<p>This clears your lessons, attempts, cards, notes, and settings from this browser.</p><div class="flex wrap" style="margin-top:22px"><button class="btn" onclick="exportData()">Export a backup first</button><button class="btn danger" onclick="resetProgress()">Reset all progress</button></div>`)}
function resetProgress(){state=defaults();reviewCurrent=null;save();closeModal();go('today');toast('A fresh start is ready.')}
function resourcesView(){return pageHead('THE REFERENCE SHELF','Keep good sources close.','Original lessons and exercises live here in Forge. These links take you to official documentation, original problems, and research behind the learning approach.')+`<div class="grid two"><div class="card pad"><h2>Learn Python at the source</h2>${[['Python tutorial','https://docs.python.org/3/tutorial/'],['Conditions, loops, and functions','https://docs.python.org/3/tutorial/controlflow.html'],['Lists, dictionaries, sets, and stacks','https://docs.python.org/3/tutorial/datastructures.html'],['Binary search with bisect','https://docs.python.org/3/library/bisect.html'],['Queues with collections.deque','https://docs.python.org/3/library/collections.html#collections.deque'],['Priority queues with heapq','https://docs.python.org/3/library/heapq.html']].map(([t,u])=>`<a class="quick-link" href="${u}" target="_blank" rel="noopener noreferrer">${t}${icon('up',13)}</a>`).join('')}</div><div class="card pad"><h2>Your problem platforms</h2>${[['Codeforces problem archive','https://codeforces.com/problemset'],['Codeforces contests','https://codeforces.com/contests'],['LeetCode problem archive','https://leetcode.com/problemset/'],['First condition practice: Watermelon','https://codeforces.com/problemset/problem/4/A'],['First loop practice: Team','https://codeforces.com/problemset/problem/231/A'],['Prefix practice: Running Sum of 1d Array','https://leetcode.com/problems/running-sum-of-1d-array/']].map(([t,u])=>`<a class="quick-link" href="${u}" target="_blank" rel="noopener noreferrer">${t}${icon('up',13)}</a>`).join('')}${state.profile.eventUrl?`<a class="quick-link" href="${esc(state.profile.eventUrl)}" target="_blank" rel="noopener noreferrer">${esc(state.profile.event)} ${icon('up',13)}</a>`:''}</div><div class="card pad"><h2>Why recall and spacing?</h2><p class="small muted" style="margin-top:12px">Research supports retrieving material from memory and distributing practice over time. Forge applies those broad principles with explanation, practice, feedback, and revisits. The exact card intervals here are a practical heuristic; they are not scientifically optimized for you or a proven route to contest wins.</p><a class="quick-link" href="https://pubmed.ncbi.nlm.nih.gov/16507066/" target="_blank" rel="noopener noreferrer">Roediger & Karpicke (2006): test-enhanced learning ${icon('up',13)}</a><a class="quick-link" href="https://pubmed.ncbi.nlm.nih.gov/16719566/" target="_blank" rel="noopener noreferrer">Cepeda et al. (2006): distributed practice review ${icon('up',13)}</a></div><div class="card pad"><h2>Using your Forge website</h2><p class="small muted" style="margin-top:12px">Open Forge in a modern browser and bookmark its address. The lessons, checks, tracker, and scheduler run without an account. To use a downloaded copy, save this page as index.html and open it directly in your browser.</p><p class="small muted">The optional Python lab downloads Pyodide from jsDelivr on first use and needs network access. External problem pages also need internet and may require a platform account to submit. If the runner cannot load, the lessons and checks still work.</p><p class="small muted">This is an editable static website that can be served by GitHub Pages. No API key is needed. All project HTML, CSS, lesson data, and JavaScript are inside index.html. Hosting makes the page available by URL; it does not add account login or cloud progress sync.</p><button class="textbtn" style="margin-top:15px" onclick="go('settings')">Back up or restore your progress ${icon('arrow',13)}</button></div></div>`}
function labView(){return pageHead('THE PYTHON LAB','Predict. Run. Change one thing.','A scratchpad for your own code. First run downloads the Python runtime; lessons and recall work without it.',`<button class="btn" onclick="download('practice.py',state.lab.code,'text/x-python')">Download .py ${icon('download',14)}</button>`)+`<div class="grid cols"><div><div class="codehead"><span>practice.py · Python 3</span><span>Tab = 4 spaces</span></div><textarea id="python-code" class="labarea" spellcheck="false" aria-label="Python code editor" oninput="state.lab.code=this.value;save()">${esc(state.lab.code)}</textarea><div class="flex wrap" style="margin:14px 0 20px"><button id="run-code" class="btn primary" onclick="runPython()">Run Python ${icon('play',14)}</button><button class="btn" onclick="stopPython()">Stop</button><span class="small muted" id="python-status">${pythonWorker?'Runtime ready':'Runtime loads on demand'}</span></div><div class="field"><label for="python-input">Standard input (one line per input() call)</label><textarea id="python-input" oninput="state.lab.stdin=this.value;save()" placeholder="For the two-number example, enter: 4 9">${esc(state.lab.stdin)}</textarea></div><h3 style="margin-bottom:10px">Output</h3><pre class="output" id="python-output" aria-live="polite">${esc(lastOutput||'Your output will appear here. Predict it first.')}</pre></div><div><div class="card pad"><h2>Your first experiments</h2><ol class="list-clean"><li>Run print(3 + 2). Change + to *.</li><li>Compare print(5) and print("5").</li><li>Change a variable and predict its new value.</li><li>Read a number from the input box.</li><li>Use the lesson’s exercise, then test a boundary.</li></ol><button class="btn small" onclick="loadLab('hello')">Load first example</button></div><div class="spacer"></div><div class="card pad"><h3>Understand the result</h3><p class="small muted" style="margin-top:12px">SyntaxError: check spelling, colons, quotes, and parentheses.<br>IndentationError: check spaces and block alignment.<br>NameError: check whether a name was defined.<br>ValueError: check input conversion.<br>IndexError: check the list’s length and index.<br>EOFError: add enough lines to the input box.</p><p class="small muted">This runs Python; it is not a hidden-test judge. Compare output against the expected result yourself, then submit real problems on their platform.</p></div></div></div>`}
let pythonWorker=null,pythonTimeout=null,pythonBusy=false,lastOutput='';
function loadLab(id){const l=L(id);state.lab.code=l.code;state.lab.stdin=id==='input'?'4 9':id==='if'?'7':id==='contest'?'5':'';save();go('lab');toast('Example loaded. Predict the output before running.')}
function labStatus(s){let el=$('#python-status');if(el)el.textContent=s}
function output(s){lastOutput=s;let el=$('#python-output');if(el)el.textContent=s}
function releaseRun(){clearTimeout(pythonTimeout);pythonBusy=false;let el=$('#run-code');if(el)el.disabled=false}
function stopPython(){if(pythonWorker)pythonWorker.terminate();pythonWorker=null;releaseRun();labStatus('Stopped · runtime reloads next run');output('Execution stopped. Check that loops make progress toward stopping.')}
function newPythonWorker(){const workerCode=`import { loadPyodide } from 'https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.mjs';
let pyPromise=loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.27.7/full/'});
self.onmessage=async(event)=>{try{const py=await pyPromise;self.postMessage({kind:'ready'});let logs=[];let lines=event.data.stdin.replace(/\\r\\n/g,'\\n').split('\\n');let idx=0;py.setStdin({stdin:()=>idx<lines.length?lines[idx++]:null});py.setStdout({batched:s=>{if(logs.length<1000)logs.push(s);}});py.setStderr({batched:s=>{if(logs.length<1000)logs.push(s);}});let dict=py.globals.get('dict');let globals=dict();dict.destroy();try{await py.runPythonAsync(event.data.code,{globals});self.postMessage({kind:'done',output:logs.join('\\n')||'(No printed output. Use print(...) to display a value.)'});}catch(e){self.postMessage({kind:'done',output:logs.join('\\n')+'\\n'+e.message});}finally{globals.destroy();}}catch(e){self.postMessage({kind:'error',output:e.message});}};`;
let blob=URL.createObjectURL(new Blob([workerCode],{type:'text/javascript'}));try{let w=new Worker(blob,{type:'module'});setTimeout(()=>URL.revokeObjectURL(blob),1000);return w}catch(e){URL.revokeObjectURL(blob);throw e}}
function runPython(){if(pythonBusy)return;state.lab.code=$('#python-code')?.value||state.lab.code;state.lab.stdin=$('#python-input')?.value??state.lab.stdin;save();pythonBusy=true;$('#run-code').disabled=true;output('Loading Python or running your code…');labStatus('Loading…');try{if(!pythonWorker)pythonWorker=newPythonWorker();pythonWorker.onmessage=e=>{if(e.data.kind==='ready'){labStatus('Running…');clearTimeout(pythonTimeout);pythonTimeout=setTimeout(()=>{stopPython();output('Stopped after 10 seconds of execution. Look for an infinite loop or reduce the input size.');},10000);return}if(e.data.kind==='error'){pythonWorker.terminate();pythonWorker=null;output('The Python runtime could not load. Check your connection and access to cdn.jsdelivr.net. You can download your .py file and run it with Python 3 locally.\n\n'+e.data.output);labStatus('Runtime unavailable')}else{output(e.data.output);labStatus('Run finished')}releaseRun()};pythonWorker.onerror=()=>{if(pythonWorker)pythonWorker.terminate();pythonWorker=null;releaseRun();labStatus('Runtime unavailable');output('Could not start the Python runtime. Your browser or network may block the external download or workers. Download your .py file and run it with Python 3, or try this page in a full browser. Lessons and checks still work.')};pythonTimeout=setTimeout(()=>{stopPython();output('Python took too long to load. Check your internet connection and try again. The rest of Forge works without the runner.');},45000);pythonWorker.postMessage({code:state.lab.code,stdin:state.lab.stdin})}catch(e){releaseRun();output('Could not start Python: '+e.message);labStatus('Runtime unavailable')}}
function render(){const route=(location.hash.slice(1)||'today').split('/'),page=route[0];updateChrome();const views={today:todayView,learn:()=>route[1]?lessonView(route[1]):learnView(),practice:practiceView,review:reviewView,roadmap:roadmapView,journal:journalView,progress:progressView,arena:arenaView,settings:settingsView,resources:resourcesView,lab:labView};$('#app').innerHTML=(views[page]||todayView)()+footer();if(page==='practice')renderProblems();if(page==='arena')updateTimer();if(page==='lab'&&pythonBusy){$('#run-code').disabled=true;labStatus('Running…')}document.title='Forge · '+($('#crumb').textContent||'Today')}
window.addEventListener('hashchange',()=>{closeModal();render();window.scrollTo(0,0)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&e.target.id==='python-code'){e.preventDefault();let t=e.target,a=t.selectionStart,b=t.selectionEnd;t.value=t.value.slice(0,a)+'    '+t.value.slice(b);t.selectionStart=t.selectionEnd=a+4;state.lab.code=t.value;save()}if(e.key==='Tab'&&$('.modal')){const list=$$('.modal button,.modal input,.modal select,.modal textarea,.modal a[href]').filter(x=>!x.disabled&&x.offsetParent!==null);let first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
setInterval(updateTimer,1000);let renderedDay=today();setInterval(()=>{if(renderedDay!==today()){renderedDay=today();render()}else updateChrome()},30000);
render();if(!storageOK)save();

function manageCards(){modal(modalHead('Your recall collection')+`<p class="small muted">Edit a question or answer without changing its schedule. Deleting a card removes its review history.</p><div style="margin-top:18px">${state.cards.length?state.cards.map(c=>`<div class="quick-link" style="gap:12px"><span>${esc(c.q)}<br><span class="small muted">Next: ${new Date(c.due).toLocaleDateString()}</span></span><button class="btn small" onclick="editCard('${c.id}')">Edit</button></div>`).join(''):'<p class="small muted">Complete a lesson or create your first card.</p>'}</div>`)}
function editCard(id){let c=state.cards.find(x=>x.id===id);if(!c)return;modal(modalHead('Edit a recall card')+`<form onsubmit="updateCard(event,'${id}')"><div class="field"><label for="edit-q">Question</label><textarea id="edit-q" name="q" required maxlength="2000">${esc(c.q)}</textarea></div><div class="field"><label for="edit-a">Answer</label><textarea id="edit-a" name="a" required maxlength="5000">${esc(c.a)}</textarea></div><div class="between"><button class="btn primary">Save changes</button><button type="button" class="btn danger small" onclick="deleteCardDialog('${id}')">Delete card…</button></div></form>`)}
function updateCard(e,id){e.preventDefault();let c=state.cards.find(x=>x.id===id),f=new FormData(e.target);let q=String(f.get('q')).trim(),a=String(f.get('a')).trim();if(!c||!q||!a)return;c.q=q;c.a=a;save();closeModal();render();toast('Card updated. Its review schedule is unchanged.')}
function deleteCardDialog(id){modal(modalHead('Delete this recall card?')+`<p>The card and its review history will be removed. Completing its lesson again can restore a default lesson card.</p><button class="btn danger" style="margin-top:20px" onclick="deleteCard('${id}')">Delete card</button>`)}
function deleteCard(id){state.cards=state.cards.filter(c=>c.id!==id);if(reviewCurrent===id)reviewCurrent=null;save();closeModal();render();toast('Card deleted.')}

<script id="native-curriculum" type="application/json">{"schema_version":"2.0.0","title":"Forge · C, C++ and the Algorithm Atlas","primary_standards":{"c":"C17","cpp":"C++17"},"authorship":"Original explanations, study plans, exercises, and templates; topic coverage inspired by cp-algorithms.com. External articles retain their own licenses.","scope_note":"This is a long-term map, not a claim that all advanced topics fit into 20 or 40 days. Complete lessons and blueprints are explicitly distinguished.","recommended_path":["cpp-foundations","cpp-stl","algebra","data-structures","dynamic-programming","graphs","strings","geometry"],"optional_path":["c-foundations"],"learning_policy":{"prerequisite_gate":"Complete prerequisite lessons before recording completion. Blueprints are study plans and cannot be marked completed in the site.","review":"Add cards after a completed lesson; retrieve before reveal; rate honestly.","transfer":"Reconstruct code from memory, then solve an unseen variation.","deadline":"Prefer foundations and event-relevant patterns before advanced breadth."},"modules":[{"id":"c-foundations","title":"C foundations for contests","language":"c","description":"Learn explicit types, input, arrays, addresses, and memory. C is an optional track; it is not a prerequisite for C++.","lessons":[{"id":"c-start","title":"A C program, from zero","language":"c","level":"foundation","content_status":"complete","prerequisites":[],"estimated_minutes":35,"objectives":["A C program is source text that a compiler translates into an executable program."],"body":["A C program is source text that a compiler translates into an executable program. Compilation checks language rules; executing the resulting program performs its instructions. A successful compilation does not prove your algorithm is correct.","#include \u003cstdio.h> makes standard input/output declarations available. int main(void) is the entry point. Braces group statements, and a semicolon ends most statements. printf writes output; \\n inside a string means a newline.","A declaration such as int score = 10 creates an integer variable and initializes it. score = score + 7 computes the right side using the old value, then stores the result. C names are case-sensitive. Read from initialized variables only.","Use +, -, *, /, and % for arithmetic. Integer division truncates toward zero, so 7 / 2 is 3. Unlike Python’s unbounded integers, C integers have finite ranges. Signed overflow is undefined behavior: choose types and bounds deliberately."],"code":"#include \u003cstdio.h>\nint main(void) {\n    int score = 10;\n    score = score + 7;\n    printf(\"%d\\n\", score);\n    return 0;\n}","stdin":"","expected_output":"17\n","checks":[{"q":"What value is printed?","answers":["17"],"why":"10 + 7 is assigned back to score."},{"q":"What is integer 7 / 2 in C?","answers":["3"],"why":"Integer division truncates toward zero."}],"recall_cards":[{"q":"What happens before a C program runs?","a":"Its source is compiled into an executable."},{"q":"Why is signed integer overflow dangerous in C?","a":"It is undefined behavior, not guaranteed wraparound."}],"source_urls":["https://gcc.gnu.org/onlinedocs/"],"practice":{"type":"trace-and-modify","instruction":"Predict the output, run the example, change one input or value, and explain the change."},"mastery_gate":{"quiz_correct":2,"independent_application_required":true}},{"id":"c-io","title":"Read and print exact values","language":"c","level":"foundation","content_status":"complete","prerequisites":["c-start"],"estimated_minutes":35,"objectives":["Formatted input in C connects a format string to addresses where values will be stored."],"body":["Formatted input in C connects a format string to addresses where values will be stored. scanf(\"%d\", &n) reads an int into n. The & operator supplies its address. Missing it for a scalar is a serious bug.","Use %d with int and %lld with long long. The declared type and format must agree. scanf returns the number of successful conversions; check it before using the variables. Whitespace between numeric input values can be spaces or newlines.","printf uses the same integer format names to display values, but receives the values, not their addresses. Print exactly what the judge requests. Extra prompts and debug messages make otherwise correct output wrong.","For input-heavy contests, buffered scanf/printf are a reasonable starting point. A custom parser is a later optimization, after correctness and profiling. In C, line-based text input can use fgets with a buffer size; never use removed, unsafe gets."],"code":"#include \u003cstdio.h>\nint main(void) {\n    long long a, b;\n    if (scanf(\"%lld %lld\", &a, &b) != 2) return 0;\n    printf(\"%lld\\n\", a + b);\n    return 0;\n}","stdin":"7 12\n","expected_output":"19\n","checks":[{"q":"How many successful conversions should reading two integers return?","answers":["2"],"why":"Each parsed integer counts as one conversion."},{"q":"For an int n, does scanf need n or &n?","answers":["&n"],"why":"scanf needs the address where it will store the value."}],"recall_cards":[{"q":"Which format matches long long?","a":"%lld"},{"q":"Why check scanf’s return value?","a":"To avoid using variables when expected input was not successfully read."}],"source_urls":["https://gcc.gnu.org/onlinedocs/"],"practice":{"type":"trace-and-modify","instruction":"Predict the output, run the example, change one input or value, and explain the change."},"mastery_gate":{"quiz_correct":2,"independent_application_required":true}},{"id":"c-control","title":"Decisions and loops in C","language":"c","level":"foundation","content_status":"complete","prerequisites":["c-io"],"estimated_minutes":35,"objectives":["Comparisons such as n >= 0 produce a truth value."],"body":["Comparisons such as n >= 0 produce a truth value. if executes its block for a nonzero condition; else handles the remaining case. Equality uses ==, while = assigns. Use braces even when a block has one statement.","Combine conditions with && for and, || for or, and ! for not. The expression n % 2 == 0 tests evenness. && and || short-circuit, so the second condition runs only if it is needed.","for (int i = 0; i \u003c n; ++i) initializes i once, checks the condition before each iteration, and increments after the body. A while loop repeats while its condition holds. Make sure the state progresses toward stopping.","Initialize an accumulator before the loop that uses it. Reset it between independent test cases. Trace the smallest allowed case and exact thresholds; off-by-one errors do not disappear when you change programming languages."],"code":"#include \u003cstdio.h>\nint main(void) {\n    int count = 0;\n    for (int i = 1; i \u003c= 10; ++i) {\n        if (i % 2 == 0) ++count;\n    }\n    printf(\"%d\\n\", count);\n    return 0;\n}","stdin":"","expected_output":"5\n","checks":[{"q":"How many even numbers from 1 through 10 are counted?","answers":["5"],"why":"They are 2, 4, 6, 8, 10."},{"q":"Which compares equality: = or ==?","answers":["=="],"why":"A single equals sign is assignment."}],"recall_cards":[{"q":"How is logical and written in C?","a":"&&"},{"q":"Where do you initialize an accumulator?","a":"Before its accumulating loop, and separately for each independent case."}],"source_urls":["https://gcc.gnu.org/onlinedocs/"],"practice":{"type":"trace-and-modify","instruction":"Predict the output, run the example, change one input or value, and explain the change."},"mastery_gate":{"quiz_correct":2,"independent_application_required":true}},{"id":"c-arrays","title":"Arrays and null-terminated strings","language":"c","level":"foundation","content_status":"complete","prerequisites":["c-control"],"estimated_minutes":35,"objectives":["An array stores a fixed number of same-type elements contiguously."],"body":["An array stores a fixed number of same-type elements contiguously. int a[3] = {4, 8, 2} has valid indices 0, 1, 2. C does not automatically check an array index. Reading or writing outside the array is undefined behavior.","The expression sizeof(a) / sizeof(a[0]) can count elements when a is an actual array in the current scope. It does not recover the length from a pointer or from an array parameter inside a function. Pass lengths explicitly.","A C string is a character sequence ending in a zero byte, written \\0. A buffer must include space for that terminator. char word[8] can hold at most seven ordinary characters plus the terminator. Use scanf(\"%7s\", word) for one whitespace-delimited word in that buffer.","For text that may contain spaces, use fgets(buffer, sizeof buffer, stdin), and account for the newline it may retain. Arrays are not assignable as whole values in C. Use loops or appropriate library operations to copy their elements."],"code":"#include \u003cstdio.h>\nint main(void) {\n    int a[3] = {4, 8, 2};\n    int sum = 0;\n    for (int i = 0; i \u003c 3; ++i) sum += a[i];\n    printf(\"%d\\n\", sum);\n    return 0;\n}","stdin":"","expected_output":"14\n","checks":[{"q":"What is the last valid index in an array of length 3?","answers":["2"],"why":"Indices start at zero."},{"q":"How many ordinary characters fit in char word[8] as a terminated string?","answers":["7"],"why":"One byte is reserved for the null terminator."}],"recall_cards":[{"q":"Does C automatically check array bounds?","a":"No. You must keep indices within the allocated range."},{"q":"What marks the end of a C string?","a":"A zero byte, written \\0."}],"source_urls":["https://gcc.gnu.org/onlinedocs/"],"practice":{"type":"trace-and-modify","instruction":"Predict the output, run the example, change one input or value, and explain the change."},"mastery_gate":{"quiz_correct":2,"independent_application_required":true}},{"id":"c-pointers","title":"Functions, addresses, and pointers","language":"c","level":"foundation","content_status":"complete","prerequisites":["c-arrays"],"estimated_minutes":35,"objectives":["A function packages instructions behind a name, parameters, and a return type."],"body":["A function packages instructions behind a name, parameters, and a return type. Parameters are passed by value in C: changing an ordinary parameter does not change the caller’s variable.","A pointer stores an address. In int *p = &x, &x is x’s address and *p accesses the int at that address. Only dereference a pointer that points to a live, suitable object. A null or dangling pointer is not usable storage.","Pass a pointer when a function must modify the caller’s object. Arrays passed to functions are represented through pointers; the function needs a separate length argument. const int *a promises not to modify elements through that pointer.","A local automatic variable stops existing when its block ends. Returning its address creates a dangling pointer. Prefer returning a value, modifying caller-owned storage, or using explicitly managed allocation with a clear owner."],"code":"#include \u003cstdio.h>\nvoid add_one(int *p) {\n    ++(*p);\n}\nint main(void) {\n    int x = 4;\n    add_one(&x);\n    printf(\"%d\\n\", x);\n    return 0;\n}","stdin":"","expected_output":"5\n","checks":[{"q":"What is x after add_one(&x) when x starts at 4?","answers":["5"],"why":"The function changes the object at x’s address."},{"q":"Does *p mean address-of or dereference?","answers":["dereference"],"why":"It accesses the pointed-to object."}],"recall_cards":[{"q":"How do you obtain x’s address?","a":"&x"},{"q":"Why must you not return the address of an automatic local variable?","a":"Its lifetime ends when the function exits, leaving a dangling pointer."}],"source_urls":["https://gcc.gnu.org/onlinedocs/"],"practice":{"type":"trace-and-modify","instruction":"Predict the output, run the example, change one input or value, and explain the change."},"mastery_gate":{"quiz_correct":2,"independent_application_required":true}},{"id":"c-memory","title":"Allocate, bound, and release memory","language":"c","level":"foundation","content_status":"complete","prerequisites":["c-pointers"],"estimated_minutes":35,"objectives":["When an array length is only known at runtime, dynamically allocated storage can hold its elements."],"body":["When an array length is only known at runtime, dynamically allocated storage can hold its elements. malloc returns a pointer or NULL if allocation fails. Include stdlib.h, check for failure, and release the allocation exactly once with free.","Compute allocation sizes without overflow. Check n \u003c= SIZE_MAX / sizeof *a before requesting n * sizeof *a bytes. Validate signed inputs before converting them to size_t, which is unsigned.","free ends the allocation’s lifetime. Do not read or write through the old pointer afterward, and do not free it again. A pointer assignment copies an address, not the allocation. Decide which part of your program owns the storage.","For debugging your own code locally, compiler warnings and address/undefined-behavior sanitizers can expose mistakes. They are debugging tools, not an untrusted-code sandbox. For C++ contests, vector usually makes ownership simpler than manual malloc/free."],"code":"#include \u003cstdio.h>\n#include \u003cstdlib.h>\n#include \u003cstdint.h>\nint main(void) {\n    size_t n = 3;\n    if (n > SIZE_MAX / sizeof(int)) return 1;\n    int *a = malloc(n * sizeof *a);\n    if (a == NULL) return 1;\n    for (size_t i = 0; i \u003c n; ++i) a[i] = (int)i + 1;\n    printf(\"%d\\n\", a[2]);\n    free(a);\n    return 0;\n}","stdin":"","expected_output":"3\n","checks":[{"q":"Which function releases malloc-allocated storage?","answers":["free","free()"],"why":"Each successful allocation needs a clear owner that releases it once."},{"q":"Is it valid to read an allocation after free? Answer yes or no.","answers":["no"],"why":"The allocated object’s lifetime has ended."}],"recall_cards":[{"q":"What must you check before allocating n elements?","a":"That the byte-count multiplication cannot overflow and that allocation succeeds."},{"q":"What does copying a pointer copy?","a":"The address, not the pointed-to allocation."}],"source_urls":["https://gcc.gnu.org/onlinedocs/"],"practice":{"type":"trace-and-modify","instruction":"Predict the output, run the example, change one input or value, and explain the change."},"mastery_gate":{"quiz_correct":2,"independent_application_required":true}}]},{"id":"cpp-foundations","title":"C++ foundations for contests","language":"cpp","description":"Start with C++17 before learning the STL. Pick one primary contest language while building fluency.","lessons":[{"id":"cpp-start","title":"Your first C++17 program","language":"cpp","level":"foundation","content_status":"complete","prerequisites":[],"estimated_minutes":35,"objectives":["C++ source is compiled before execution."],"body":["C++ source is compiled before execution. A compiler translates valid source into a program; it cannot prove that the program solves your problem. Compile errors, runtime errors, and wrong answers are different kinds of feedback.","#include \u003ciostream> declares stream input and output. int main() is the entry point. Braces group statements and semicolons end most statements. std::cout writes values with \u003c\u003c. The character literal '\\n' writes a newline.","Declare a variable with a type: int score = 10. Assignment stores a value; == compares two values. long long is useful for larger sums, but it is still bounded. Signed overflow is undefined behavior.","Use explicit initialization. The compiler will not safely invent a value for an uninitialized local integer. Predict the result of each line, then compile and run a small complete program."],"code":"#include \u003ciostream>\nint main() {\n    int score = 10;\n    score += 7;\n    std::cout \u003c\u003c score \u003c\u003c '\\n';\n}","stdin":"","expected_output":"17\n","checks":[{"q":"What value is printed?","answers":["17"],"why":"The variable increases from 10 to 17."},{"q":"Does compilation alone prove that your algorithm is correct? Answer yes or no.","answers":["no"],"why":"It checks language rules, not whether you solved the task."}],"recall_cards":[{"q":"What is main?","a":"The program’s entry point."},{"q":"How do you write a newline without explicitly flushing cout?","a":"std::cout \u003c\u003c '\\n';"}],"source_urls":["https://gcc.gnu.org/onlinedocs/"],"practice":{"type":"trace-and-modify","instruction":"Predict the output, run the example, change one input or value, and explain the change."},"mastery_gate":{"quiz_correct":2,"independent_application_required":true}},{"id":"cpp-io","title":"C++ input and output","language":"cpp","level":"foundation","content_status":"complete","prerequisites":["cpp-start"],"estimated_minutes":35,"objectives":["std::cin >> a >> b reads two whitespace-separated values into existing variables."],"body":["std::cin >> a >> b reads two whitespace-separated values into existing variables. The operator selects conversions from their declared types. Test the stream result before using values when input might be missing.","For ordinary batch contests, call std::ios::sync_with_stdio(false) and std::cin.tie(nullptr) before I/O. These disable C/C++ stream synchronization and remove cin’s automatic tie to cout. Avoid mixing scanf/printf with unsynchronized cin/cout.","Use '\\n' for ordinary newlines. std::endl also flushes the output buffer. Interactive problems need explicit flushing before you wait for the judge; optimization must not break the protocol.","Use std::getline for a whole text line. Numeric extraction can leave a newline waiting, so reason about that transition. Do not print prompts or assume an initial test-case count unless the statement specifies one."],"code":"#include \u003ciostream>\nint main() {\n    std::ios::sync_with_stdio(false);\n    std::cin.tie(nullptr);\n    long long a, b;\n    if (!(std::cin >> a >> b)) return 0;\n    std::cout \u003c\u003c a + b \u003c\u003c '\\n';\n}","stdin":"7 12\n","expected_output":"19\n","checks":[{"q":"What extra action does std::endl perform after a newline?","answers":["flush","flushes","flushing"],"why":"It flushes the output stream."},{"q":"For input 7 12, what sum is printed?","answers":["19"],"why":"Both extracted integers are added."}],"recall_cards":[{"q":"What does cin.tie(nullptr) remove?","a":"The tied output stream that would otherwise be flushed before input operations."},{"q":"When must you explicitly flush output?","a":"When an interactive protocol needs to receive your query before replying."}],"source_urls":["https://gcc.gnu.org/onlinedocs/"],"practice":{"type":"trace-and-modify","instruction":"Predict the output, run the example, change one input or value, and explain the change."},"mastery_gate":{"quiz_correct":2,"independent_application_required":true}},{"id":"cpp-control","title":"Conditions and loops","language":"cpp","level":"foundation","content_status":"complete","prerequisites":["cpp-io"],"estimated_minutes":35,"objectives":["Use if, else if, and else to select a block."],"body":["Use if, else if, and else to select a block. Comparisons use ==, !=, \u003c, \u003c=, >, >=. Combine conditions with &&, ||, and !. A nonzero scalar condition is treated as true.","A for loop has initialization, condition, and update sections. for (int i = 0; i \u003c n; ++i) visits zero through n - 1. The check happens before the body, so n = 0 gives no iterations.","A while loop repeats while its condition holds. Make progress toward stopping. break exits the nearest loop; continue skips to its next iteration. Braces make the boundaries of blocks explicit.","Counters and sums must be initialized before accumulating. Reset them for each independent test case. Test a condition exactly at its threshold as well as on each side."],"code":"#include \u003ciostream>\nint main() {\n    int sum = 0;\n    for (int i = 1; i \u003c= 4; ++i) sum += i;\n    std::cout \u003c\u003c sum \u003c\u003c '\\n';\n}","stdin":"","expected_output":"10\n","checks":[{"q":"What is the sum from 1 through 4?","answers":["10"],"why":"1 + 2 + 3 + 4 is 10."},{"q":"How many iterations does for (int i=0; i\u003c3; ++i) perform?","answers":["3"],"why":"It visits 0, 1, and 2."}],"recall_cards":[{"q":"What is the distinction between i \u003c n and i \u003c= n in a zero-based loop?","a":"The latter includes n and may access beyond an n-element sequence."},{"q":"What keeps a while loop from running forever?","a":"A state change that eventually makes its condition false."}],"source_urls":["https://gcc.gnu.org/onlinedocs/"],"practice":{"type":"trace-and-modify","instruction":"Predict the output, run the example, change one input or value, and explain the change."},"mastery_gate":{"quiz_correct":2,"independent_application_required":true}},{"id":"cpp-functions","title":"Functions, references, and const","language":"cpp","level":"foundation","content_status":"complete","prerequisites":["cpp-control"],"estimated_minutes":35,"objectives":["Functions name a computation."],"body":["Functions name a computation. int add(int a, int b) receives copies of two integers and returns an integer. return sends a value to the caller; printing merely displays output.","A reference parameter such as int& x refers to the caller’s object. Updating x changes that object. Pass a large read-only structure as const T& to avoid copying while preventing modification through that reference.","const communicates a restriction on modification. auto asks the compiler to deduce a type from an initializer; it does not mean that the variable can dynamically change type like a Python name.","An object’s lifetime matters. Do not return a reference or pointer to an automatic local variable. Avoid unnecessary copies in a loop, but also avoid retaining references that a later container operation may invalidate."],"code":"#include \u003ciostream>\nvoid add_one(int& x) { ++x; }\nint main() {\n    int x = 4;\n    add_one(x);\n    std::cout \u003c\u003c x \u003c\u003c '\\n';\n}","stdin":"","expected_output":"5\n","checks":[{"q":"What does x become in this program?","answers":["5"],"why":"The reference parameter modifies the caller’s x."},{"q":"For a large read-only object, prefer a copy or const reference?","answers":["const reference","const t&","const&"],"why":"A const reference avoids the copy and prevents modification through it."}],"recall_cards":[{"q":"How is int x different from int& x as a parameter?","a":"The first is a copy; the second refers to the caller’s object."},{"q":"What does auto do?","a":"It deduces a fixed compile-time type from the initializer."}],"source_urls":["https://gcc.gnu.org/onlinedocs/"],"practice":{"type":"trace-and-modify","instruction":"Predict the output, run the example, change one input or value, and explain the change."},"mastery_gate":{"quiz_correct":2,"independent_application_required":true}},{"id":"cpp-sequences","title":"Vectors and strings","language":"cpp","level":"foundation","content_status":"complete","prerequisites":["cpp-functions"],"estimated_minutes":35,"objectives":["std::vector\u003cT> is a resizable contiguous sequence."],"body":["std::vector\u003cT> is a resizable contiguous sequence. std::vector\u003cint> a{4, 8, 2} has three elements. Indices start at zero; a.size() gives the number of elements. Indexing with [] does not automatically check bounds.","push_back appends. A range-for loop visits elements: for (int x : a) copies each int; for (auto& x : a) allows modifications. reserve increases capacity without creating elements, while resize changes the number of elements.","std::string manages a sequence of characters. Use .size(), indexing, concatenation, and standard algorithms rather than manually reserving a null terminator as with a raw C character buffer. cin >> word reads a whitespace-delimited word; getline reads a line.","A vector append may reallocate its storage and invalidate references and iterators. Do not keep an iterator across an operation that might invalidate it. For nested vectors, each inner vector has its own size and allocation."],"code":"#include \u003ciostream>\n#include \u003cvector>\nint main() {\n    std::vector\u003cint> a{4, 8, 2};\n    a.push_back(5);\n    long long sum = 0;\n    for (int x : a) sum += x;\n    std::cout \u003c\u003c sum \u003c\u003c '\\n';\n}","stdin":"","expected_output":"19\n","checks":[{"q":"What is the sum after appending 5?","answers":["19"],"why":"4 + 8 + 2 + 5 is 19."},{"q":"Does reserve(10) create ten elements? Answer yes or no.","answers":["no"],"why":"It changes capacity, not size."}],"recall_cards":[{"q":"What is the difference between reserve and resize?","a":"reserve provides capacity; resize changes the actual number of elements."},{"q":"Why can push_back invalidate a reference?","a":"It may move the vector’s elements into a newly allocated buffer."}],"source_urls":["https://gcc.gnu.org/onlinedocs/"],"practice":{"type":"trace-and-modify","instruction":"Predict the output, run the example, change one input or value, and explain the change."},"mastery_gate":{"quiz_correct":2,"independent_application_required":true}},{"id":"cpp-costs","title":"Types, cost, and contest constraints","language":"cpp","level":"foundation","content_status":"complete","prerequisites":["cpp-sequences"],"estimated_minutes":35,"objectives":["Big-O describes how work grows with input size."],"body":["Big-O describes how work grows with input size. One complete scan is O(n); all ordered pairs usually require O(n²). Two consecutive scans still take O(n), whereas two full nested scans take O(n²).","A problem with n = 200,000 usually rules out a straightforward quadratic scan under normal contest limits. Faster syntax cannot fix an unsuitable growth rate. Estimate both the number of operations and extra memory.","Widen arithmetic before it overflows: 1LL * a * b evaluates the product in long long when a and b are ints. long long answer = a * b can overflow in the int expression before assignment. All intermediate values still need to fit.","Prefer using aliases and constexpr constants to broad macros. #define int long long rewrites tokens throughout your program and hides types. A macro can evaluate an argument multiple times. A function has clearer type and evaluation rules."],"code":"#include \u003ciostream>\nusing i64 = long long;\nint main() {\n    int a = 100000, b = 100000;\n    i64 product = 1LL * a * b;\n    std::cout \u003c\u003c product \u003c\u003c '\\n';\n}","stdin":"","expected_output":"10000000000\n","checks":[{"q":"What is the product of 100000 and 100000?","answers":["10000000000"],"why":"It exceeds a typical signed 32-bit int range."},{"q":"Two full nested n-element loops have O(n) or O(n^2) growth?","answers":["o(n^2)","n^2","o(n²)"],"why":"Each of n outer visits has n inner visits."}],"recall_cards":[{"q":"Why does assigning a*b to long long not always prevent overflow?","a":"a*b can be computed in int before the result is assigned."},{"q":"What is preferable to #define int long long?","a":"An explicit long long declaration or a using alias such as using i64 = long long."}],"source_urls":["https://gcc.gnu.org/onlinedocs/"],"practice":{"type":"trace-and-modify","instruction":"Predict the output, run the example, change one input or value, and explain the change."},"mastery_gate":{"quiz_correct":2,"independent_application_required":true}}]},{"id":"cpp-stl","title":"C++ STL & Fast I/O","language":"cpp","description":"The first full deep-dive module: container selection, efficient I/O, sorting contracts, binary search, and an original practice problem.","lessons":[{"id":"cpp-stl-fast-io","title":"C++ STL for Competitive Programming & Fast I/O","language":"cpp","level":"core","content_status":"complete","prerequisites":["cpp-costs"],"estimated_minutes":120,"objectives":["Choose a container by required operations and complexity.","Use batch and interactive I/O correctly.","Explain iterator validity and lower/upper-bound contracts.","Solve static threshold queries without discarding duplicates."],"markdown_path":"content/cpp-stl-fast-io.md","template_paths":["templates/cpp17-starter.cpp","templates/stl-workbench.cpp","templates/scoreboard-thresholds.cpp"],"code":"#include \u003calgorithm>\n#include \u003ciostream>\n#include \u003cvector>\nint main() {\n    std::ios::sync_with_stdio(false);\n    std::cin.tie(nullptr);\n    int n, q;\n    if (!(std::cin >> n >> q)) return 0;\n    std::vector\u003clong long> scores(n);\n    for (auto& value : scores) std::cin >> value;\n    std::sort(scores.begin(), scores.end());\n    while (q--) {\n        long long x;\n        std::cin >> x;\n        auto it = std::lower_bound(scores.begin(), scores.end(), x);\n        auto count = scores.end() - it;\n        long long smallest = it == scores.end() ? -1 : *it;\n        std::cout \u003c\u003c count \u003c\u003c ' ' \u003c\u003c smallest \u003c\u003c '\\n';\n    }\n}\n","stdin":"5 4\n10 20 20 40 50\n20\n21\n51\n0\n","expected_output":"4 20\n2 40\n0 -1\n5 10\n","checks":[{"q":"First value at least x: lower_bound or upper_bound?","answers":["lower_bound"],"why":"lower_bound includes equality; upper_bound excludes it."},{"q":"Does map[key] insert a missing key? Answer yes or no.","answers":["yes"],"why":"operator[] inserts a value-initialized mapped value when absent."}],"recall_cards":[{"q":"When is std::endl necessary instead of a plain newline?","a":"Use an explicit flush when an interactive judge must receive your query before replying."},{"q":"What must you check before dereferencing lower_bound’s result?","a":"That the result is not end()."},{"q":"What happens to a vector’s size after reserve?","a":"It stays the same; only capacity may increase."},{"q":"Why is \u003c= not a valid sorting comparator?","a":"It is not strict: an element can compare before itself."},{"q":"What type does accumulate(..., 0LL) use?","a":"A long long accumulator."},{"q":"What guarantees differ between map and unordered_map?","a":"map maintains order with logarithmic operations; unorde <template id="stl-article"><h1>C++ STL for Competitive Programming &amp; Fast I/O</h1>
<p><strong>Language:</strong> C++17 · <strong>Track:</strong> C++ foundations · <strong>Suggested study:</strong> two or three focused sessions</p>
<p><strong>Prerequisites:</strong> variables and types, conditions, loops, functions, references, and Big-O notation. If any of these are unfamiliar, use the C++ foundation lessons first. You do not need to learn C before C++.</p>
<p><strong>Outcome:</strong> read contest input reliably, select a suitable standard container, sort and search correctly, and explain both the cost and the failure cases of your solution.</p>
<p>This is original teaching material and independently written code. The advanced topic map draws inspiration from cp-algorithms; this lesson does not reproduce its articles.</p>
<h2>1. Your first contest program</h2>
<p>A C++ program is compiled before it runs. Headers declare library facilities, <code>main</code> is the entry point, braces delimit blocks, and most statements end with a semicolon. <code>std::</code> names a facility in the standard library. Compilation errors and errors that happen while a valid program runs are different stages.</p>
<pre><code class="language-cpp">#include &lt;iostream&gt;

int main() {
    std::ios::sync_with_stdio(false);
    std::cin.tie(nullptr);

    long long a, b;
    if (!(std::cin &gt;&gt; a &gt;&gt; b)) return 0;
    std::cout &lt;&lt; a + b &lt;&lt; &#39;\n&#39;;

<p>With input <code>7 12</code>, the output is <code>19</code>. <code>&gt;&gt;</code> reads whitespace-separated values: a space or a newline between them works. <code>&lt;&lt;</code> writes output. The input check exits cleanly if the required values are absent. This example assumes the sum fits in <code>long long</code>.</p>
<p>Do not add <code>Enter a number:</code> prompts to a judged program. Read the statement to determine whether a test-case count exists. If it does, read it and call a <code>solve()</code> function once per case; otherwise, call <code>solve()</code> once.</p>
<h3>What the two I/O lines actually do</h3>
<p><code>sync_with_stdio(false)</code> permits the C++ streams to operate independently of the C standard streams. Call it before doing any input or output. After disabling synchronization, avoid mixing <code>cin</code>/<code>cout</code> with <code>scanf</code>/<code>printf</code> in the same program. This is a practical performance choice, not a universal guarantee that all input becomes fast enough.</p>
<p>By default, reading from <code>cin</code> can flush its tied output stream. <code>cin.tie(nullptr)</code> removes that tie. For ordinary batch problems, unnecessary flushing wastes work. For an <strong>interactive</strong> problem, explicitly flush each query before waiting for the judge: <code>std::cout &lt;&lt; query &lt;&lt; std::endl;</code> or <code>std::cout &lt;&lt; query &lt;&lt; &#39;\n&#39; &lt;&lt; std::flush;</code>.</p>
<p><code>&#39;\n&#39;</code> writes a newline. <code>std::endl</code> writes a newline <strong>and flushes</strong>. Prefer <code>&#39;\n&#39;</code> for ordinary output. Do not remove flushing from an interactive protocol simply because a template says to.</p>
<p>For full lines, use <code>std::getline(std::cin, line)</code>. If a preceding <code>&gt;&gt;</code> left a newline pending, consume it deliberately, for example with <code>std::getline(std::cin &gt;&gt; std::ws, line)</code>. <code>std::ws</code> also removes leading whitespace, so do not use it if those leading spaces are meaningful.</p>
<p><strong>Predict:</strong> If a program reads two integers with <code>cin &gt;&gt; a &gt;&gt; b</code>, does putting them on separate lines change the sum? No: both extractions skip ordinary leading whitespace.</p>
<p>The shorter examples below are fragments: put headers at the top of your file, helper functions outside <code>main</code>, and executable statements inside <code>main</code> or <code>solve</code>. The downloadable STL workbench combines the container examples into one complete program.</p>
<h2>2. Types, overflow, and useful aliases</h2>
<p><code>int</code> is commonly 32 bits on contest platforms, but C++ only specifies minimum ranges. Use <code>long long</code> for sums that may exceed a 32-bit signed range. A wider destination does not retroactively widen an earlier expression:</p>
<pre><code class="language-cpp">int a = 100000, b = 100000;
long long product = 1LL * a * b; // multiplication now occurs in long long
</code></pre>
<p>Signed overflow is undefined behavior. Even <code>long long</code> is finite. Bound the largest intermediate value, not only the final answer. If you need fixed-width types, use <code>&lt;cstdint&gt;</code> and <code>std::int64_t</code> when supported. GNU&#39;s <code>__int128</code> is a useful nonstandard extension on some contest compilers; check the permitted compiler before relying on it.</p>
<p>Prefer aliases, constants, and functions over macros:</p>
<pre><code class="language-cpp">using i64 = long long;
constexpr i64 MOD = 1&#39;000&#39;000&#39;007LL;

bool improve_min(i64&amp; best, i64 candidate) {
    if (candidate &lt; best) { best = candidate; return true; }
    return false;
}
</code></pre>
<p>The <code>&amp;</code> parameter lets the function update the caller&#39;s variable. Avoid <code>#define int long long</code>: it rewrites unrelated declarations and hides the types you are trying to reason about. A macro such as <code>#define SQUARE(x) ((x)*(x))</code> evaluates its argument twice; <code>SQUARE(i++)</code> is a trap. Use a function. <code>#define ALL(v) (v).begin(), (v).end()</code> is seen in contest code, but explicit iterators are clearer while learning; do not pass a side-effecting expression to it.</p>
<p><code>&lt;bits/stdc++.h&gt;</code> is a GNU convenience header, not a standard C++ header. The downloadable templates use explicit headers and C++17 features.</p>
<h2>3. <code>vector</code>: the default sequence</h2>
<p>Think of <code>std::vector&lt;T&gt;</code> as a resizable contiguous array. It provides constant-time indexing, amortized constant-time append, and a size that you can inspect.</p>
<pre><code class="language-cpp">#include &lt;vector&gt;
#include &lt;algorithm&gt;
#include &lt;iostream&gt;

std::vector&lt;int&gt; values{8, 3, 8, 1};
values.push_back(5);
std::sort(values.begin(), values.end());
for (const int x : values) std::cout &lt;&lt; x &lt;&lt; &#39; &#39;;
std::cout &lt;&lt; &#39;\n&#39;; // 1 3 5 8 8
</code></pre>
<p>A range-for loop visits values. <code>const auto&amp; x</code> avoids copying a large element while preventing changes. <code>auto&amp; x</code> permits updates. <code>auto x</code> makes a copy. For an <code>int</code>, copying is usually exactly what you want.</p>
<p><code>std::vector&lt;int&gt; a(n)</code> creates <strong>n elements</strong> initialized to zero. <code>a.reserve(n)</code> only reserves capacity; it does not create elements. Writing <code>a[0]</code> after reserving an empty vector is invalid. Use <code>push_back</code> or resize first.</p>
<p><code>a[i]</code> does not check its bounds. In a debug experiment, <code>a.at(i)</code> can help catch an out-of-range access. Appending may reallocate the vector and invalidate pointers, references, and iterators into it. Do not keep such a handle across an operation that can invalidate it.</p>
<p>Removing duplicates after sorting is a two-step operation:</p>
<pre><code class="language-cpp">std::sort(values.begin(), values.end());
values.erase(std::unique(values.begin(), values.end()), values.end());
</code></pre>
<p><code>unique</code> compacts adjacent distinct values and returns a new logical end. <code>erase</code> actually shrinks the vector. This deliberately loses multiplicity; do not apply it when frequencies matter.</p>
<h2>4. Sorting and strict comparators</h2>
<p><code>std::sort</code> needs random-access iterators and makes O(n log n) comparisons. The default order is ascending. Pairs are ordered lexicographically: first component first, then second.</p>
<pre><code class="language-cpp">#include &lt;algorithm&gt;
#include &lt;utility&gt;
#include &lt;vector&gt;

std::vector&lt;std::pair&lt;int, int&gt;&gt; tasks{{3, 9}, {1, 9}, {2, 5}};
std::sort(tasks.begin(), tasks.end(), [](const auto&amp; a, const auto&amp; b) {
    if (a.second != b.second) return a.second &lt; b.second;
    return a.first &lt; b.first;
});
// (2,5), (1,9), (3,9): second value first, then first value
</code></pre>
<p>A sorting comparator must define a strict weak ordering. At minimum, an item must not compare less than itself. Using <code>&lt;=</code> violates that rule. Prefer <code>a.score &lt; b.score</code> to subtracting scores and comparing with zero; subtraction itself can overflow.</p>
<p><code>std::sort</code> is not stable. If preserving the original order among equivalent keys matters, choose <code>std::stable_sort</code> or make the original position an explicit tie-breaker. Sorting can also destroy the input order needed by a problem; preserve indices when necessary.</p>
<h2>5. Binary search without off-by-one guesses</h2>
<p>Binary search requires data ordered consistently with the search comparison. For an ascending vector:</p>
<pre><code class="language-cpp">std::vector&lt;int&gt; a{2, 4, 4, 9};
auto lo = std::lower_bound(a.begin(), a.end(), 4);
auto hi = std::upper_bound(a.begin(), a.end(), 4);
long long count = hi - lo; // 2
bool exists = lo != a.end() &amp;&amp; *lo == 4;
</code></pre>
<p><code>lower_bound</code> finds the first element at least the target. <code>upper_bound</code> finds the first strictly greater element. On a vector, each search uses O(log n) comparisons and iterator movement. Subtracting the two iterators gives the number of occurrences.</p>
<p>The result can equal <code>end()</code>. That is a position after the last element, not an element you may dereference. Check before using <code>*it</code>. Search ranges follow <code>[first, last)</code>: include the first position and exclude the last.</p>
<p>Do not use the generic <code>std::lower_bound(set.begin(), set.end(), x)</code> expecting logarithmic traversal: set iterators are not random-access, and iterator advancement may be linear. Use the container&#39;s <code>set.lower_bound(x)</code> member instead.</p>
<h2>6. Ordered sets and maps</h2>
<p><code>std::set&lt;T&gt;</code> stores unique ordered keys. <code>std::multiset&lt;T&gt;</code> permits duplicate keys. <code>std::map&lt;Key, Value&gt;</code> stores one associated value per ordered key. The standard specifies logarithmic complexity for their usual search and insertion operations; you do not need to depend on a particular tree implementation.</p>
<pre><code class="language-cpp">#include &lt;map&gt;
#include &lt;set&gt;
#include &lt;vector&gt;

std::map&lt;int, int&gt; frequency;
for (int x : std::vector&lt;int&gt;{5, 2, 5}) ++frequency[x];
// frequency[2] is 1; frequency[5] is 2

std::set&lt;int&gt; available{2, 5, 8};
auto it = available.lower_bound(4); // points to 5
if (it != available.end()) available.erase(it);
</code></pre>
<p><code>frequency[x]</code> inserts a zero-initialized mapped value if x is absent. That is convenient for counting but surprising for a read-only membership test. Use <code>find</code> to avoid insertion. <code>contains</code> is a C++20 facility, so these C++17 templates use <code>find(...) != end()</code>.</p>
<p>For a multiset, <code>erase(value)</code> erases <strong>all</strong> equal elements. To remove one occurrence, find an iterator and erase that iterator. Never erase <code>end()</code>.</p>
<h2>7. Hash containers: average speed, different guarantees</h2>
<p><code>std::unordered_map</code> and <code>std::unordered_set</code> support average O(1) lookup and insertion under the usual hash assumptions. Individual operations can degrade to O(n). They provide neither sorted iteration nor ordered lower bounds.</p>
<pre><code class="language-cpp">#include &lt;unordered_map&gt;

std::unordered_map&lt;int, int&gt; frequency;
frequency.max_load_factor(0.7f);
frequency.reserve(200000);
++frequency[42];
</code></pre>
<p>Reserving can reduce rehashing, and a lower maximum load factor trades memory for fewer average collisions. Neither change guarantees protection from adversarial collisions. When worst-case predictability matters, consider an ordered map, sorting, or coordinate compression. Do not call a hash-based method unconditionally O(n) overall without mentioning its assumptions.</p>
<p>A rehash invalidates iterators. Avoid keeping an iterator across insertions that might rehash. Ask which operations the task needs before deciding that a hash container is automatically the fastest choice.</p>
<h2>8. Stack, queue, deque, and priority queue</h2>
<p>Use a stack for the most recently unfinished item, a queue for the oldest waiting item, and a deque when both ends matter. A vector with <code>push_back</code>, <code>back</code>, and <code>pop_back</code> is often a convenient stack.</p>
<pre><code class="language-cpp">#include &lt;queue&gt;
#include &lt;deque&gt;
#include &lt;functional&gt;
#include &lt;vector&gt;

std::queue&lt;int&gt; q;
q.push(3);
int first = q.front();
q.pop(); // pop returns void; it does not return the removed value

std::deque&lt;int&gt; dq;
dq.push_back(4);
dq.push_front(2);

std::priority_queue&lt;int&gt; largest_first;
std::priority_queue&lt;int, std::vector&lt;int&gt;, std::greater&lt;int&gt;&gt; smallest_first;
smallest_first.push(9);
smallest_first.push(3);
int minimum = smallest_first.top(); // 3
smallest_first.pop();
</code></pre>
<p>Check <code>empty()</code> before <code>front</code>, <code>back</code>, <code>top</code>, or removal. A priority queue provides O(1) access to its top and O(log n) insertion/removal. It does not directly remove arbitrary elements or decrease a stored key. In Dijkstra&#39;s algorithm, a common alternative is to push a new <code>(distance, vertex)</code> pair and discard stale pairs when popped.</p>
<p>A default priority queue is a <strong>max-heap</strong>. Accidentally using it for a smallest-distance-first algorithm is a common contest bug. Pairs in a priority queue still follow lexicographic comparison.</p>
<h2>9. A small algorithm toolbox</h2>
<pre><code class="language-cpp">#include &lt;algorithm&gt;
#include &lt;numeric&gt;
#include &lt;vector&gt;

std::vector&lt;int&gt; a{4, 1, 7};
long long sum = std::accumulate(a.begin(), a.end(), 0LL);
int maximum = *std::max_element(a.begin(), a.end()); // a must be nonempty
std::reverse(a.begin(), a.end());
std::vector&lt;int&gt; ids(3);
std::iota(ids.begin(), ids.end(), 0); // 0, 1, 2
</code></pre>
<p>The third argument to <code>accumulate</code> determines the accumulator type. <code>0</code> gives an <code>int</code> accumulator; <code>0LL</code> gives <code>long long</code>. A final assignment to <code>long long</code> does not repair an overflow that already happened in an <code>int</code> accumulator.</p>
<p>For coordinate compression, copy the values, sort the copy, remove duplicates, and use a lower-bound index as the compressed coordinate. Compression preserves order and equality, not numeric distances. Two adjacent compressed indices may represent values very far apart.</p>

<h2>11. Original practice problem: Scoreboard Thresholds</h2>
<p>A training club has n recorded scores. Each query gives a threshold x. For every query, report:</p>
<ol>
<li>the number of recorded scores greater than or equal to x, counting duplicates;</li>
<li>the smallest recorded score greater than or equal to x, or -1 if none exists.</li>
</ol>
<p>The scores never change between queries.</p>
<p><strong>Input:</strong> the first line contains n and q. The next line contains n scores. Each of the following q lines contains one threshold x.</p>
<p><strong>Constraints:</strong> 1 ≤ n, q ≤ 200,000. Scores and thresholds are integers from 0 through 1,000,000,000.</p>
<p><strong>Output:</strong> one line per query, containing the count and the smallest qualifying score, separated by a space.</p>
<pre><code class="language-text">Input
5 4
10 20 20 40 50
20
21
51
0

Output
4 20
2 40
0 -1
5 10
</code></pre>
<p>For threshold 20, both occurrences of 20 count, as do 40 and 50. For threshold 51 there is no qualifying score.</p>
<h3>Try before looking at the method</h3>
<ul>
<li>What changes if a query equals a duplicated score?</li>
<li>How much work would scanning all n scores for each of q queries require?</li>
<li>Which fact about the data allows you to preprocess only once?</li>
</ul>
<h3>Hint ladder</h3>
<p><strong>Hint 1:</strong> Sorting groups all qualifying scores into a suffix.</p>
<p><strong>Hint 2:</strong> The first element of that suffix is the lower bound of x, not the upper bound.</p>
<p><strong>Hint 3:</strong> If its index is k, the suffix contains n - k elements. Handle k == n before dereferencing.</p>
<h3>Method and correctness</h3>
<p>Sort all scores in nondecreasing order. For each threshold, find its lower bound. By definition, every earlier score is less than x. Every score at or after that iterator is at least x, so exactly those scores qualify. Their number is the suffix length. If the suffix is nonempty, its first value is its minimum. If empty, output <code>0 -1</code>.</p>
<p>Preprocessing takes O(n log n) time. Each query takes O(log n), for total O(n log n + q log n). The vector stores O(n) values. Duplicate scores must remain in the vector because the task counts occurrences.</p>
<pre><code class="language-cpp">#include &lt;algorithm&gt;
#include &lt;iostream&gt;
#include &lt;vector&gt;

int main() {
    std::ios::sync_with_stdio(false);
    std::cin.tie(nullptr);

    int n, q;
    if (!(std::cin &gt;&gt; n &gt;&gt; q)) return 0;
    std::vector&lt;long long&gt; scores(n);
    for (auto&amp; value : scores) std::cin &gt;&gt; value;
    std::sort(scores.begin(), scores.end());

    while (q--) {
        long long x;
        std::cin &gt;&gt; x;
        auto it = std::lower_bound(scores.begin(), scores.end(), x);
        auto count = scores.end() - it;
        long long smallest = it == scores.end() ? -1 : *it;
        std::cout &lt;&lt; count &lt;&lt; &#39; &#39; &lt;&lt; smallest &lt;&lt; &#39;\n&#39;;
    }
}
</code></pre>
<h3>Test deliberately</h3>
<ul>
<li>n = 1; threshold smaller than, equal to, and larger than the one score.</li>
<li>All scores equal; the threshold equals that repeated value.</li>
<li>Scores already sorted, reverse sorted, and containing zero.</li>
<li>Every query above the maximum, then every query below the minimum.</li>
<li>Large n and q to expose an O(nq) implementation.</li>
</ul>
<p><strong>Transfer exercise:</strong> Change the question to count scores strictly greater than x. Explain why <code>upper_bound</code> replaces <code>lower_bound</code>. Then extend each query to count scores in an inclusive range [L, R]. Derive the two bounds before coding.</p>
