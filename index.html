</style><script id="problem-briefs" type="application/json">{"lc-1":{"summary":"Given a list of integers and a target, return the indices of two different entries whose values add to the target. The task promises one valid pair.","exampleInput":"nums = [4, 9, 2], target = 11","exampleOutput":"[1, 2]","prompt":"Indices refer to positions, not the values themselves.","authorship":"Original Forge study brief with an original example. This is a compact restatement, not the full official statement or its limits."},"lc-217":{"summary":"Decide whether an integer list contains any value more than once.","exampleInput":"nums = [8, 3, 8]","exampleOutput":"true","prompt":"The repeated values can be far apart.","authorship":"Original Forge study brief with an original example. This is a compact restatement, not the full official statement or its limits."},"lc-242":{"summary":"Decide whether two lowercase strings contain exactly the same letters with the same multiplicities.","exampleInput":"s = \"dusty\", t = \"study\"","exampleOutput":"true","prompt":"Equal sets of letters are insufficient; compare counts.","authorship":"Original Forge study brief with an original example. This is a compact restatement, not the full official statement or its limits."},"lc-2235":{"summary":"Return the sum of the two supplied integers.","exampleInput":"num1 = -6, num2 = 14","exampleOutput":"8","prompt":"Return the value from the required function.","authorship":"Original Forge study brief with an original example. This is a compact restatement, not the full official statement or its limits."},"lc-1480":{"summary":"For each position in an integer list, compute the sum from the beginning through that position.","exampleInput":"nums = [3, -1, 5]","exampleOutput":"[3, 2, 7]","prompt":"The current total is the previous total plus the new element.","authorship":"Original Forge study brief with an original example. This is a compact restatement, not the full official statement or its limits."},"lc-1672":{"summary":"Each row of a matrix lists one person’s account balances. Return the largest row sum.","exampleInput":"accounts = [[3, 4], [2, 8], [6, 1]]","exampleOutput":"10","prompt":"Compare totals rather than individual cells.","authorship":"Original Forge study brief with an original example. This is a compact restatement, not the full official statement or its limits."},"lc-1929":{"summary":"Return a list made by placing a copy of the input list immediately after the original.","exampleInput":"nums = [7, 2]","exampleOutput":"[7, 2, 7, 2]","prompt":"Preserve order in both copies.","authorship":"Original Forge study brief with an original example. This is a compact restatement, not the full official statement or its limits."},"lc-1920":{"summary":"For a zero-based permutation nums, build an output where output[i] equals nums[nums[i]].","exampleInput":"nums = [1, 2, 0]","exampleOutput":"[2, 0, 1]","prompt":"Trace the inner index before reading the outer value.","authorship":"Original Forge study brief with an original example. This is a compact restatement, not the full official statement or its limits."},"lc-412":{"summary":"Build the strings for integers 1 through n: use Fizz for multiples of 3, Buzz for multiples of 5, and FizzBuzz for multiples of both; otherwise use the number.","exampleInput":"n = 5","exampleOutput":"[\"1\", \"2\", \"Fizz\", \"4\", \"Buzz\"]","prompt":"Check the combined condition before either individual condition.","authorship":"Original Forge study brief with an original example. This is a compact restatement, not the full official statement or its limits."},"lc-1281":{"summary":"For a positive integer, return its digit product minus its digit sum.","exampleInput":"n = 312","exampleOutput":"0","prompt":"A zero digit makes the product zero.","authorship":"Original Forge study brief with an original example. This is a compact restatement, not the full official statement or its limits."},"lc-704":{"summary":"Find a target in a sorted integer array. Return its index, or -1 if absent.","exampleInput":"nums = [-4, 1, 6, 12], target = 6","exampleOutput":"2","prompt":"Maintain a search interval that can still contain the answer.","authorship":"Original Forge study brief with an original example. This is a compact restatement, not the full official statement or its limits."},"lc-35":{"summary":"In a strictly increasing integer array, return the target’s position, or the position where inserting it would preserve sorted order.","exampleInput":"nums = [2, 5, 9], target = 7","exampleOutput":"2","prompt":"The answer can equal the array length.","authorship":"Original Forge study brief with an original example. This is a compact restatement, not the full official statement or its limits."},"lc-121":{"summary":"Choose one day to buy and a later day to sell. Return the greatest possible nonnegative profit.","exampleInput":"prices = [9, 4, 7, 2, 8]","exampleOutput":"6","prompt":"The buy must happen before the sell.","authorship":"Original Forge study brief with an original example. This is a compact restatement, not the full official statement or its limits."},"lc-20":{"summary":"Check whether a string of round, square and curly brackets closes every opener in the correct nesting order.","exampleInput":"s = \"{[()]}\"","exampleOutput":"true","prompt":"Equal counts do not guarantee correct nesting.","authorship":"Original Forge study brief with an original example. This is a compact restatement, not the full official statement or its limits."},"lc-206":{"summary":"Reverse a singly linked list and return its new head.","exampleInput":"head = 4 → 8 → 1","exampleOutput":"1 → 8 → 4","prompt":"Preserve the next pointer before redirecting a link.","authorship":"Original Forge study brief with an original example. This is a compact restatement, not the full official statement or its limits."},"lc-21":{"summary":"Merge two sorted linked lists into a sorted result by connecting their nodes.","exampleInput":"a = 1 → 7, b = 3 → 5","exampleOutput":"1 → 3 → 5 → 7","prompt":"The smaller current head is the next safe choice.","authorship":"Original Forge study brief with an original example. This is a compact restatement, not the full official statement or its limits."},"lc-70":{"summary":"Count how many ordered sequences of one-step and two-step moves reach stair n.","exampleInput":"n = 4","exampleOutput":"5","prompt":"Count move sequences, not just the number of two-step moves.","authorship":"Original Forge study brief with an original example. This is a compact restatement, not the full official statement or its limits."},"lc-198":{"summary":"Choose a subset of nonadjacent houses to maximize the sum of their values.","exampleInput":"values = [3, 8, 4, 9]","exampleOutput":"17","prompt":"For each position compare taking it with skipping it.","authorship":"Original Forge study brief with an original example. This is a compact restatement, not the full official statement or its limits."},"lc-322":{"summary":"Using unlimited coins of the given denominations, find the fewest coins that sum to an amount, or -1 if no combination works.","exampleInput":"coins = [1, 4, 6], amount = 8","exampleOutput":"2","prompt":"Taking the largest coin first need not be optimal.","authorship":"Original Forge study brief with an original example. This is a compact restatement, not the full official statement or its limits."},"lc-200":{"summary":"Count connected groups of land cells in a grid. Land connects vertically or horizontally; diagonals do not connect.","exampleInput":"grid = [\"110\", \"010\", \"001\"]","exampleOutput":"2","prompt":"Mark a cell when adding it to your traversal to avoid duplicate work.","authorship":"Original Forge study brief with an original example. This is a compact restatement, not the full official statement or its limits."},"lc-733":{"summary":"Starting at one image cell, recolor all four-directionally connected cells with its original color.","exampleInput":"image = [[2,2],[2,3]], start = (0,0), color = 7","exampleOutput":"[[7,7],[7,3]]","prompt":"If the new color equals the old color, stop immediately.","authorship":"Original Forge study brief with an original example. This is a compact restatement, not the full official statement or its limits."},"lc-104":{"summary":"Return the maximum number of nodes on a path from a binary tree’s root to a leaf.","exampleInput":"root 6 has child 2, which has child 9","exampleOutput":"3","prompt":"An empty tree has depth zero.","authorship":"Original Forge study brief with an original example. This is a compact restatement, not the full official statement or its limits."},"cf-4-A":{"summary":"Decide whether an integer weight can be split into two strictly positive even integer weights.","exampleInput":"weight = 10","exampleOutput":"YES","prompt":"Both pieces must be positive; test weight 2 separately.","authorship":"Original Forge study brief with an original example. This is a compact restatement, not the full official statement or its limits."},"cf-71-A":{"summary":"For each word, leave it unchanged if it has at most ten characters. Otherwise output its first letter, the count of interior letters, and its last letter.","exampleInput":"word = \"characterization\"","exampleOutput":"c14n","prompt":"The threshold uses the full word length.","authorship":"Original Forge study brief with an original example. This is a compact restatement, not the full official statement or its limits."},"cf-231-A":{"summary":"Each row contains three binary decisions. Count rows where at least two decisions are 1.","exampleInput":"rows = [[1,0,1], [0,1,0], [1,1,1]]","exampleOutput":"2","prompt":"Sum the three values in each row.","authorship":"Original Forge study brief with an original example. This is a compact restatement, not the full official statement or its limits."},"cf-50-A":{"summary":"Find the maximum number of nonoverlapping 2-cell dominoes that fit on an m-by-n rectangular board.","exampleInput":"m = 3, n = 5","exampleOutput":"7","prompt":"An odd total cell count leaves one cell uncovered.","authorship":"Original Forge study brief with an original example. This is a compact restatement, not the full official statement or its limits."},"cf-282-A":{"summary":"Start an integer at zero and process statements that increment or decrement it once. Return the final integer.","exampleInput":"statements = [\"++X\", \"X--\", \"X++\"]","exampleOutput":"1","prompt":"Prefix versus postfix does not change this task’s final value.","authorship":"Original Forge study brief with an original example. This is a compact restatement, not the full official statement or its limits."},"cf-1-A":{"summary":"Cover a rectangular area with square tiles of a fixed side length. Tiles may extend beyond its border. Find the minimum number of tiles.","exampleInput":"height = 7, width = 10, side = 4","exampleOutput":"6","prompt":"Round up each dimension independently and use a wide product.","authorship":"Original Forge study brief with an original example. This is a compact restatement, not the full official statement or its limits."},"at-abc086_a":{"summary":"Read two integers and report whether their product is odd or even.","exampleInput":"a = 5, b = 8","exampleOutput":"Even","prompt":"A product is odd exactly when both factors are odd.","authorship":"Original Forge study brief with an original example. This is a compact restatement, not the full official statement or its limits."},"at-abc081_a":{"summary":"Count how many of the three supplied binary characters are 1.","exampleInput":"bits = \"101\"","exampleOutput":"2","prompt":"Characters and integer values are different types.","authorship":"Original Forge study brief with an original example. This is a compact restatement, not the full official statement or its limits."},"at-abc081_b":{"summary":"Repeatedly divide every number in the list by two while all numbers are even. Count how many complete rounds are possible.","exampleInput":"values = [12, 20, 28]","exampleOutput":"2","prompt":"The first number that becomes odd stops the whole process.","authorship":"Original Forge study brief with an original example. This is a compact restatement, not the full official statement or its limits."},"at-abc087_b":{"summary":"Count combinations of available 500-, 100- and 50-value coins that total a target. Coins of the same value are indistinguishable.","exampleInput":"available = [1, 2, 3], target = 200","exampleOutput":"2","prompt":"Enumerate quantities within their available limits.","authorship":"Original Forge study brief with an original example. This is a compact restatement, not the full official statement or its limits."},"at-abc083_b":{"summary":"Among integers from 1 to n, sum those whose decimal digit sum lies in the inclusive interval [a,b].","exampleInput":"n = 12, a = 3, b = 3","exampleOutput":"15","prompt":"Test the digit sum, then add the original number.","authorship":"Original Forge study brief with an original example. This is a compact restatement, not the full official statement or its limits."},"at-abc088_b":{"summary":"Two players alternate taking one remaining number. Both maximize their own final total. Return the first player’s total minus the second player’s total.","exampleInput":"values = [9, 2, 6, 1]","exampleOutput":"4","prompt":"Sort in descending order and alternate ownership.","authorship":"Original Forge study brief with an original example. This is a compact restatement, not the full official statement or its limits."},"at-abc085_b":{"summary":"Each item has a size. Find the maximum length of a stack whose sizes strictly decrease from bottom to top.","exampleInput":"sizes = [8, 5, 8, 3]","exampleOutput":"3","prompt":"Only distinct sizes contribute another level.","authorship":"Original Forge study brief with an original example. This is a compact restatement, not the full official statement or its limits."},"at-abc085_c":{"summary":"Given a count of banknotes and a total value, find counts   function proseHTML(text){
    // Treat every character as text first. Only a small Markdown subset is rendered.
    const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\$([^$\n]+)\$/g,(_m,math)=>`<span class="math-inline" data-math="${math.replaceAll('"','&quot;')}">${math}</span>`);
    let code=false,buffer=[],output=[];
    for(const line of String(text).split('\n')){
      if(line.trim().startsWith('```')){if(code){output.push('<pre>'+esc(buffer.join('\n'))+'</pre>');buffer=[];}code=!code;continue;}
      if(code){buffer.push(line);continue;}
      if(/^#{1,6}\s/.test(line)){output.push('<h3>'+inline(line.replace(/^#+\s*/,''))+'</h3>');continue;}
      if(/^\s*>/.test(line)){output.push('<p class="thinking-line">'+inline(line.replace(/^\s*>\s?/,''))+'</p>');continue;}
      if(/^\s*[-*]\s/.test(line)){output.push('<p class="editorial-list-item">• '+inline(line.replace(/^\s*[-*]\s*/,''))+'</p>');continue;}
      output.push(line.trim()?'<p>'+inline(line)+'</p>':'');
    }
    if(buffer.length)output.push('<pre>'+esc(buffer.join('\n'))+'</pre>');return output.join('');
  }

  function pythonRun(code,stdin,ctx){return new Promise((resolve,reject)=>{

    `<div class="grid cols campaign-today"><div class="card pad"><h2>Today’s useful work</h2><p class="muted small">Review due cards, learn the next prerequisite, then attempt the tasks that fit your level and time.</p><div class="daily-learning-links"><a class="quick-link" href="#review">${dueCards().length} recall cards due ${icon('arrow',13)}</a>${next?`<a class="quick-link" href="#${next.route}/${next.id}">Next lesson: ${esc(next.title)} ${icon('arrow',13)}</a>`:''}</div>${!foundationReady()?'<p class="small muted">Complete your language’s conditions, loops and arrays lessons to unlock the daily problem queue. You can browse the full catalog now.</p>':''}${items.map(x=>`<a class="daily-task" href="#problem/${x.problem.id}"><span>${platformPill(x.problem)} ${badge(levelText(x.problem))}<b>${esc(x.problem.title)}</b><small>${esc(x.reason)}</small></span><span>→</span></a>`).join('')||'<p class="small muted">No new tasks are ready in the current band. Continue a prerequisite, revisit your mistakes, or browse the library.</p>'}</div><div class="card pad"><h2>How difficulty changes</h2><p>Codeforces starts around 800. AtCoder starts with its lowest estimated band.</p><p class="small muted">Each task contributes evidence once. Four independent solves within 45 minutes out of five distinct tasks near your current level raise the band by 100. Three stuck results in that group lower it by 100, down to the starting floor. Unrated tasks do not change a numeric band.</p><p class="small muted">LeetCode begins with Easy tasks. Ten distinct independent Easy solves unlock Medium recommendations; thirty independent Medium solves unlock Hard. These are local practice rules, not official ratings.</p><a class="btn" href="#practice">Browse every indexed task</a></div></div>`+
    `<div class="month-grid">${[
      ['Month 1','Language fluency and reliable basics','Read input, trace loops, use arrays and maps, test tiny cases.',settings().primaryLanguage==='python'?['hello','input','loops','lists','functions','counting']:settings().primaryLanguage==='c'?['c-start','c-io','c-control','c-arrays']:['cpp-start','cpp-io','cpp-control','cpp-sequences','cpp-stl-fast-io']],

    ].map(([name,title,description,ids],i)=>`<article class="card pad"><span class="eyebrow muted">${name} · ${C.addMonths(s.start,i)}–${C.addMonths(s.start,i+1)}</span><h2>${title}</h2><p class="small muted">${description}</p><div class="month-links">${phaseLinks(ids.filter(id=>L(id)||nativeLessons.some(l=>l.id===id)))}</div></article>`).join('')}</div><p class="small muted">These phases guide topic order. Your next lesson follows prerequisites and your next problems follow evidence; a date never grants a skill automatically.</p>`;
  }
  function planSettings(){const s=settings();modal(modalHead('Your four-month plan')+`<form onsubmit="ForgeStudy.savePlan(event)"><div class="field"><label for="plan-start">Start date</label><input id="plan-start" name="start" type="date" required value="${s.start}"></div><div class="field"><label for="plan-language">Primary practice language</label><select id="plan-language" name="language">${[['python','Python'],['c','C'],['cpp','C++']].map(([v,t])=>`<option value="${v}" ${s.primaryLanguage===v?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label for="plan-scope">LeetCode completion goal</label><select id="plan-scope" name="scope"><option value="all" ${s.scope==='all'?'selected':''}>All indexed problems, including SQL and JavaScript</option><option value="algorithms" ${s.scope==='algorithms'?'selected':''}>Algorithm problems only</option></select></div><div class="field"><label for="plan-estimate">Initial estimate: minutes per problem</label><input id="plan-estimate" name="estimate" type="number" min="5" max="180" value="${s.minutesPerProblem}" required></div><label class="inline-check"><input name="premium" type="checkbox" ${s.premium?'checked':''}> Include Premium-marked tasks in my daily recommendations</label><p class="small muted">The end date will be four calendar months after the start. Daily available time comes from your existing Settings and check-in.</p><button class="btn primary">Save plan</button></form>`);}
  function savePlan(event){event.preventDefault();const f=new FormData(event.target),s={...settings(),start:String(f.get('start')),primaryLanguage:String(f.get('language')),scope:String(f.get('scope')),minutesPerProblem:Number(f.get('estimate')),premium:f.get('premium')!==null};if(!C.validDate(s.start)){toast('Choose a valid start date.');return;}s.end=C.addMonths(s.start,4);try{C.validate(s);}catch(e){toast(e.message);return;}state.study=s;save();closeModal();go('roadmap');}
  settingsView=function(){return previous.settingsView()+`<section class="card pad lesson-sources"><h2>Four-month learning campaign</h2><p class="muted">${settings().start} → ${settings().end} · Primary language: ${settings().primaryLanguage.toUpperCase()}</p><button class="btn primary" onclick="ForgeStudy.planSettings()">Edit four-month plan</button></section>`;};
  resourcesView=function(){return pageHead('YOUR REFERENCE SHELF','The right source for each idea.','Every lesson has a specific reading selection. Open the lesson to use its prefilled Python Tutor visualization.')+`<div class="card pad"><h2>Visualize and practice here</h2><div class="reference-list"><a class="quick-link" href="#practice">LeetCode, Codeforces and AtCoder problem library ${icon('arrow',13)}</a><a class="quick-link" href="#roadmap">Four-month adaptive plan ${icon('arrow',13)}</a><button class="quick-link textbtn" onclick="ForgeStudy.visualizeLesson('hello')">Python Tutor inside Forge ${icon('play',13)}</button></div></div><div class="reference-directory">${[['Python',LESSONS],['C',nativeLessons.filter(l=>l.language==='c')],['C++ and algorithms',nativeLessons.filter(l=>l.language==='cpp')]].map(([name,lessons])=>`<section class="card pad"><h2>${name}</h2>${lessons.map(l=>`<div class="reference-directory-row"><a href="#${name==='Python'?'learn':'native'}/${l.id}"><b>${esc(l.title)}</b></a>${(refs[l.id]||[]).map(r=>`<span class="small">${link(r.url,r.title)}</span>`).join('')}</div>`).join('')}</section>`).join('')}</div><p class="small muted">${link('https://github.com/axsimarosmelos/forge/blob/main/content/catalog/NOTICE.md','Catalog, video and editorial credits')}</p>`;};
  updateChrome=function(){previous.updateChrome();const s=settings(),duration=C.days(s.start,s.end),day=Math.max(1,Math.min(duration,C.days(s.start,today())+1));$('#side-day').textContent=String(day).padStart(2,'0')+' / '+duration;const route=location.hash.slice(1).split('/')[0];if(['practice','problem'].includes(route))$('#crumb').textContent='Problem library';if(route==='roadmap')$('#crumb').textContent='Four-month plan';};
  render=function(){const route=(location.hash.slice(1)||'today').split('/');
    if(['practice','problem','roadmap','prep'].includes(route[0])){updateChrome();$('#app').innerHTML=(route[0]==='practice'?libraryView():route[0]==='problem'?problemView(route[1]):route[0]==='roadmap'?planView():`<div class="language-tabs"><a class="btn" href="#roadmap">Four-month learning plan</a><a class="btn primary" href="#prep">Competition preparation</a></div>`+previous.roadmapView())+footer();document.title='Forge · '+(route[0]==='problem'?problem(route[1])?.title||'Problem':route[0]==='roadmap'?'Four-month plan':'Problem library');if(route[0]==='practice')renderCatalogRows();if(route[0]==='problem'){paintProblemEditor(route[1]);if(openedEditorial.has(route[1]))loadMath();}}
    else{previous.render();if(route[0]==='native'&&nativeLessons.some(l=>l.id===route[1])){const node=document.createElement('div');node.innerHTML=referencePanel(route[1]);$('#app').prepend(node);}if(route[0]==='lab'){const panel=document.createElement('div');panel.className='banner';panel.innerHTML='<button class="textbtn" onclick="ForgeStudy.visualizeLab()">Visualize this code with Python Tutor</button> · Step through memory inside Forge.';$('#app').prepend(panel);}if(route[0]==='today'){const banner=document.createElement('div');banner.className='card pad campaign-banner';banner.innerHTML=`<div><span class="eyebrow muted">YOUR FOUR-MONTH CAMPAIGN</span><h2>Learn. Attempt. Recall. Adjust.</h2><p class="small muted">${settings().start} → ${settings().end} · LeetCode, Codeforces and AtCoder in your problem library.</p></div><div class="flex wrap"><a class="btn primary" href="#roadmap">Today’s adaptive plan →</a><a class="btn" href="#practice">Open problem library</a></div>`;$('#app').prepend(banner);}}
  };
  document.addEventListener('keydown',event=>{if(event.key==='Tab'&&event.target.id==='problem-code'){event.preventDefault();const input=event.target,a=input.selectionStart,b=input.selectionEnd;input.value=input.value.slice(0,a)+'    '+input.value.slice(b);input.selectionStart=input.selectionEnd=a+4;updateWorkspace(location.hash.split('/')[1],'code',input.value);}});
  window.ForgeStudy={markHelp,referencePanel,visualizeLesson,visualizeLab:labVisualization,visualizeProblem:id=>{const w=workspace(id);displayTutor(w.drafts[w.language],w.language,w.stdin);},setFilter,search:value=>{filters.query=value;filters.page=0;clearTimeout(searchTimer);searchTimer=setTimeout(renderCatalogRows,150);},page:delta=>{filters.page=Math.max(0,filters.page+delta);renderCatalogRows();window.scrollTo(0,0);},reload:()=>{C.platforms.forEach(p=>loadCatalog(p,true));},retry:p=>loadCatalog(p,true),update:updateWorkspace,syncScroll:syncProblemScroll,language:(id,language)=>{if(!['python','c','cpp'].includes(language))return;if(runContext?.id===id)stopRun();workspace(id).language=language;dirtyWorkspace(id);save();render();},showVideo,saveVideo,reveal,loadTemplate,addRecall,saveRecall,log,run:runProblem,stop:stopRun,planSettings,savePlan,download:id=>{const w=workspace(id);download(id+'.'+(w.language==='python'?'py':w.language==='c'?'c':'cpp'),w.drafts[w.language],'text/plain');},
    // Exposed read-only/pure helpers support transparent diagnostics and regression tests.
    acceptCatalog:accept,allProblems,mergedAttempts,dailyTasks,proseHTML,editorialHTML,loadAll};
  render();if(typeof fetch==='function'&&location.protocol!=='file:')void loadAll();
})();
</script><script>// Keep larger code workspaces in IndexedDB while preserving Forge's portable JSON backup.
(() => {
  const oldSave=save,oldExport=exportData,initialState=state;
  let lastState=state,db=null,unavailable=false,hydrated=false;
  const dirty=new Set(Object.keys(state.study?.workspaces||{})),touched=new Set(dirty);
  const epoch=()=>{if(!state.study.workspaceEpoch)state.study.workspaceEpoch=Date.now().toString(36)+Math.random().toString(36).slice(2,10);return state.study.workspaceEpoch;};
  epoch();
  const warn=()=>{const el=document.querySelector('#storage-warning');if(el){el.textContent='Some code workspaces could not be saved in this browser. Export a progress backup before closing.';el.classList.remove('hide');}const label=document.querySelector('#save-label');if(label)label.textContent='Backup needed';};
  function putMany(rows,generation){return new Promise((resolve,reject)=>{const tx=db.transaction('workspaces','readwrite'),store=tx.objectStore('workspaces');for(const [id,value] of rows)store.put({key:generation+':'+id,generation,id,value});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||Error('Workspace save was aborted.'));});}
  const ready=typeof indexedDB==='undefined'?Promise.resolve(null):new Promise((resolve,reject)=>{
    const request=indexedDB.open('forge-code-workspaces',1);
    request.onupgradeneeded=()=>request.result.createObjectStore('workspaces',{keyPath:'key'});
    request.onerror=()=>reject(request.error);request.onblocked=()=>reject(Error('Workspace database is blocked by another tab.'));
    request.onsuccess=()=>{db=request.result;const generation=epoch(),read=db.transaction('workspaces','readonly').objectStore('workspaces').getAll();read.onerror=()=>reject(read.error);read.onsuccess=()=>{
      if(state===initialState)for(const row of read.result)if(row.generation===generation&&!touched.has(row.id))state.study.workspaces[row.id]=row.value;
      hydrated=true;resolve(db);if(location.hash.startsWith('#problem/'))render();
    };};
  }).catch(()=>{unavailable=true;warn();return null;});
  window.ForgeWorkspaceStorage={touch:id=>{dirty.add(id);touched.add(id);},ready};
  save=function(){
    if(!state.study)return oldSave();
    const changedState=state!==lastState;
    if(changedState){lastState=state;state.study.workspaceEpoch=Date.now().toString(36)+Math.random().toString(36).slice(2,10);for(const id of Object.keys(state.study.workspaces))dirty.add(id);}
    const workspaces=state.study.workspaces,generation=epoch();
    if(typeof indexedDB==='undefined'||unavailable){oldSave();return;}
    // Persist metadata with the original save path. Drafts are committed separately below.
    state.study.workspaces={};try{oldSave();}finally{state.study.workspaces=workspaces;}
    const rows=[...dirty].filter(id=>workspaces[id]).map(id=>[id,structuredClone(workspaces[id])]);dirty.clear();
    if(rows.length)void ready.then(database=>{if(!database){oldSave();warn();return;}return putMany(rows,generation);}).catch(()=>{unavailable=true;warn();});
  };
  exportData=async function(){await ready;if(!hydrated&&typeof indexedDB!=='undefined'&&unavailable)warn();oldExport();};
  // Save the namespace immediately so the next visit can locate this browser's workspaces.
  save();
})();
</script></body></html>
